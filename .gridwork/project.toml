# gridwork — ecosystem manifest.
#
# This is a tooling manifest, not a build input: nothing in this repository
# reads it, and no gate depends on it. It exists so external tooling can
# discover the project's name, phase, and branch convention without parsing
# the workflow file.
#
# Schema note for anyone editing it: `name`, not `slug`. Both are accepted by
# the readers, but `name` is what the generator emits and the only spelling
# under test.
#
# Deliberately public-safe. Sibling manifests elsewhere cite their schema by
# absolute path into a private checkout; that citation cannot come along here,
# because this repository is public and its leak scanner rejects private repo
# names and absolute home paths — correctly. Describe the schema, do not link
# to it.

[project]
name = "gridwork"
display_name = "GridWork"
central_version = ">=1.0.0"
current_phase = "execute"

[session]
branch_prefix = "feature/"

# Gates — recorded as a comment deliberately: no reader parses a stack or
# commands key, and no manifest in the wild carries one. Declaring them as TOML
# keys would invent a contract nothing honors. `.github/workflows/ci.yml` is the
# executable source of truth; this list is a map to it.
#
# This repo's gates do NOT hang off a root package.json, because there isn't
# one. Three independent projects share a checkout: a Cargo workspace at the
# root and two unrelated Bun projects, each with its own lockfile and its own
# `bun install`. "Run the gates" therefore means three working directories, not
# one script.
#
#   root (cargo)   cargo fmt --all -- --check
#                  cargo clippy --all-targets --locked -- -D warnings
#                  cargo test --all-targets --locked
#                  Never --workspace or --all-features: six crates are outside
#                  `default-members` (Zig-toolchain and anticipated-dependency
#                  reasons, Cargo.toml:2-26) and carry dedicated CI jobs.
#   site/ (bun)    bun run typecheck   (next typegen && tsc --noEmit)
#                  bun run check:docs  (mirror freshness — see below)
#                  bun run build
#   contracts/     no scripts of its own; `bun test` from the directory.
#                  Regenerated by `cargo run -p xtask -- contract`.
#
#   repo-wide      ./tools/leak-scan.sh
#                  ./tools/check-claims.sh
#                  ./tools/cleanroom-gate.sh   (reads a changed-path LIST on
#                                               stdin, one path per line — see
#                                               below)
#                  ./tools/verify-gates.sh     (the CI aggregator's assertion)
#
# The cleanroom gate is the one entry here that can report a clean verdict on a
# change it never inspected, so its input shape is not a detail. Run bare it
# reads nothing and passes anything; piped a unified diff it fails the same way
# for the same reason, because not one line of that is a path it can match.
# Both spellings print `clean — no engine-adjacent paths touched` for a change
# that touches them. Feed it the real thing:
#
#     git diff --cached --no-renames --name-only | ./tools/cleanroom-gate.sh
#
# CI is `.github/workflows/ci.yml` — 21 jobs plus the `verify` aggregator.
# Branch protection requires exactly one context, `verify`, which aggregates 18
# of the 21; the other three — `perf-attempt`, `perf-retry`, `advisories` — are
# `continue-on-error` and cannot fail anything.
#
# Code scanning lives outside the file and does not count the way it reads. Five
# languages are configured, but `javascript` and `typescript` share one
# analysis, so three `Analyze` runs appear — on every commit, main included. A
# fourth check named `CodeQL` appears on pull request heads ONLY: it comes from
# a different app and reports alert status rather than running an analysis. A PR
# therefore shows four and main shows three, and neither number is wrong.
#
# Counted from the file and from live check runs on both a PR head and main, not
# carried forward. Worth saying why the last line is spelled out: the first pass
# at this edit counted main alone, concluded three, and would have replaced a
# correct number with a wrong one in the commit that exists to fix wrong
# numbers. A count is only as good as the ref it was taken on.
#
# Editing README.md, docs/*.md, or docs/derivation/reviews/ reds the docs
# freshness gate until the site mirror is re-curated: mirror prose, the
# `curated-from` sha inside the mirror, and the page sha in
# site/content/source-map.json all move together.
#
# Stack: Rust 2024 (MSRV 1.94, `unsafe_code = "forbid"`, `unwrap_used = "deny"`)
# for the kernel, TUI, PTY host, and adapters; Next.js 16 + React 19 + Tailwind 4
# on Bun for site/, deployed to Railway from site/Dockerfile.
#
# This repo is the SOURCE of the house Rust gate, not a target of it. Its 15
# crates are a house-standards SPEC non-goal; other repos are conformed to what
# is here, and the seeded-violation self-test pattern (a gate fed a synthetic
# violation, failing if it is ACCEPTED) originated here and is now house-wide.
#
# Clean-room: paths in .github/cleanroom-paths.txt are legally constrained.
# Read CLAUDE.md before touching them.
