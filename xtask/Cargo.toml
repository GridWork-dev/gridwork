[package]
name = "xtask"
version = "0.0.0"
description = "Workspace task runner: codegen and release glue (cargo run -p xtask -- <task>)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The specta trio is REPLACEABLE build tooling behind this task runner — the
# committed contracts/ artifacts are the product; nothing outside xtask
# depends on these exporter crates.
[dependencies]
gwk-domain = { path = "../crates/gwk-domain" }
gwk-theme = { path = "../crates/gwk-theme" }
serde = "1"
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
