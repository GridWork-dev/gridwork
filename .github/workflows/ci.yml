name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - name: the performance whole-job guard fails closed (seeded violation)
        run: |
          set -euo pipefail
          if ./tools/perf-job-guard.sh final failure failure; then
            echo 'perf-job-guard accepted two misses — the retry guard is broken' >&2
            exit 1
          fi
          if ./tools/perf-job-guard.sh final success skipped; then
            echo 'perf-job-guard accepted a skipped parallel run - the retry guard is broken' >&2
            exit 1
          fi
          if ./tools/perf-job-guard.sh final skipped success; then
            echo 'perf-job-guard accepted a skipped parallel run - the retry guard is broken' >&2
            exit 1
          fi
          if ./tools/perf-job-guard.sh final invalid success; then
            echo 'perf-job-guard accepted invalid first-run evidence' >&2
            exit 1
          fi
          if ./tools/perf-job-guard.sh final success invalid; then
            echo 'perf-job-guard accepted invalid second-run evidence' >&2
            exit 1
          fi
          [ "$(./tools/perf-job-guard.sh attempt success success)" = 'outcome=success' ]
          [ "$(./tools/perf-job-guard.sh attempt failure success)" = 'outcome=failure' ]
          [ "$(./tools/perf-job-guard.sh attempt success failure)" = 'outcome=invalid' ]
          [ "$(./tools/perf-job-guard.sh attempt skipped success)" = 'outcome=invalid' ]
          ./tools/perf-job-guard.sh final success success
          ./tools/perf-job-guard.sh final success failure
          ./tools/perf-job-guard.sh final failure success
      # DEFAULT members, not `--workspace`. `--workspace` overrides
      # `default-members` and would pull in gwk-pty, which needs Zig and a 71 MB
      # ghostty tree — and whose build script CLONES ghostty when
      # GHOSTTY_SOURCE_DIR is unset, so a stray `--workspace` here is a
      # network-reaching build, not just a slow one. The `pty` job covers that
      # crate with the same three commands.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      # Ruling 9: `cargo install gridwork` must not require Zig. That holds only
      # while gwk-pty stays out of the CLI's dependency closure, so assert it
      # rather than trusting that nobody wires them together later.
      - name: the installable crate carries the lens without the PTY toolchain
        run: |
          set -euo pipefail
          if cargo tree -p gridwork --edges normal --prefix none | grep -qE 'libghostty|gwk-pty'; then
            echo 'gridwork grew the PTY stack — the installed TUI must remain a thin client' >&2
            exit 1
          fi
          # Positive controls: the same greps against trees that DO carry the
          # matches, or the check above passes by not working. The deliberate
          # runtime flip makes gwk-tui a normal installed edge.
          cargo tree -p gwk-pty --edges normal --prefix none | grep -q libghostty
          cargo tree -p gridwork --edges normal --prefix none | grep -q gwk-tui
          echo "gridwork carries gwk-tui and remains Zig-free; the greps that prove it are live"
      # The engine adapters enable serde_json/preserve_order. Cargo feature
      # unification means building one beside `gw` would then change the key
      # order in values the kernel hashes, even though the `gw` graph alone is
      # deterministic. Guard the deployable's resolved graph, not Cargo.toml.
      - name: the gw feature graph excludes the build-dependent serde_json features
        run: |
          set -euo pipefail
          features=/tmp/gridwork-serde-json-features.txt
          cargo tree -p gridwork -e features,no-dev -i serde_json > "$features"
          # THREE features, not the one that has bitten. Each makes the kernel's
          # projection digest a property of the build rather than of the data:
          # `preserve_order` moves object key order, `arbitrary_precision`
          # changes how a JSON number round-trips, `float_roundtrip` changes
          # float parsing. `canonical_line` sorts keys and can do nothing at all
          # about the other two, so this rung is the only thing standing between
          # them and a hash that two honest builds disagree about.
          checked=0
          for feature in preserve_order arbitrary_precision float_roundtrip; do
            forbidden="serde_json feature \"$feature\""
            if grep -Fq "$forbidden" "$features"; then
              echo "gridwork enables serde_json/$feature — kernel hashes now depend on the build" >&2
              grep -F "$forbidden" "$features" >&2
              exit 1
            fi
            # Its OWN positive control. One seed standing for three would leave
            # two greps that have never been shown to match anything.
            seeded="/tmp/seeded-gridwork-$feature.txt"
            cp "$features" "$seeded"
            printf '%s\n' "$forbidden" >> "$seeded"
            if ! grep -Fq "$forbidden" "$seeded"; then
              echo "the seeded $feature was not detected — that grep is decoration" >&2
              exit 1
            fi
            checked=$((checked + 1))
          done
          # The count before the verdict. A loop over an empty list reaches the
          # same success line as one that checked all three.
          if [ "$checked" -ne 3 ]; then
            echo "only $checked of 3 features were checked" >&2
            exit 1
          fi
          echo 'gridwork excludes all three build-dependent serde_json features; each seeded control is detected'
      # P6(a): the console is a THIN CLIENT. PTY sessions and engine adapters
      # live server-side in their own host crate and the console consumes frames
      # as wire data, which is what makes attach-from-anywhere fall out instead
      # of needing to be built — a console owning its own PTY could only ever
      # show the sessions on the box it runs on. That posture survives exactly
      # as long as nobody adds the convenient direct dependency, so assert it.
      - name: the console never links the PTY engine
        run: |
          set -euo pipefail
          if cargo tree -p gwk-tui --edges normal --prefix none | grep -qE 'libghostty|gwk-pty'; then
            echo 'gwk-tui depends on the PTY stack — the thin-client boundary is gone' >&2
            exit 1
          fi
          # Same positive control as above, for the same reason: a grep that
          # matches nothing anywhere would pass this check by not working.
          cargo tree -p gwk-pty --edges normal --prefix none | grep -q gwk-pty
          echo "gwk-tui is free of the PTY stack; the grep that proves it is live"
      # ratatui 0.30 split the project into `ratatui-core` (the types) and the
      # crates built on it. Every widget and effect crate in that ecosystem
      # re-exports `ratatui_core::buffer::Buffer`, so TWO `ratatui-core`
      # versions in one graph are two incompatible `Buffer` types: the failure
      # is a wall of trait-mismatch errors at the seam between a widget crate
      # and the frame it was handed, and it reads as our bug. The assertion is
      # cheap and lands now, while `ratatui` is the only crate in the tree
      # pulling `ratatui-core` — so the bump that brings a second one (an
      # effects crate for the Hall, on its own release cadence) arrives at a
      # named check instead of at that error.
      - name: exactly one ratatui-core in the lockfile
        run: |
          set -euo pipefail
          # One function over a file path, run against the real lockfile and
          # then against a seeded copy, so the check and its negative cannot
          # drift apart into two different greps.
          cores() { grep -c '^name = "ratatui-core"$' "$1" || true; }
          n="$(cores Cargo.lock)"
          if [ "$n" != "1" ]; then
            echo "Cargo.lock carries $n ratatui-core packages; exactly 1 is required" >&2
            grep -n -A1 '^name = "ratatui-core"$' Cargo.lock >&2
            exit 1
          fi
          # The seeded negative. A lockfile is the one input here, so the seed
          # is a second package block in a copy of it — the exact shape a bump
          # that fails to unify would produce.
          cp Cargo.lock /tmp/seeded-two-cores.lock
          printf '\n[[package]]\nname = "ratatui-core"\nversion = "0.0.0-seeded"\n' >> /tmp/seeded-two-cores.lock
          if [ "$(cores /tmp/seeded-two-cores.lock)" = "1" ]; then
            echo 'the count did not move with a second ratatui-core present — the check is broken' >&2
            exit 1
          fi
          echo "cargo.lock carries exactly one ratatui-core; the seeded second one is counted"

  unicode-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Unicode tables and the published grapheme corpus agree
        run: cargo test -p gwk-text --all-targets --locked
      - name: prove the Unicode table-version gate can fail (seeded violation)
        run: |
          set -euo pipefail
          source=crates/gwk-text/src/lib.rs
          cp "$source" /tmp/gwk-text-lib.rs
          trap 'cp /tmp/gwk-text-lib.rs "$source"' EXIT

          sed -i 's/pub const UNICODE_VERSION: (u64, u64, u64) = (17, 0, 0);/pub const UNICODE_VERSION: (u64, u64, u64) = (16, 0, 0);/' "$source"
          if cargo check -p gwk-text --locked > /tmp/unicode-version-seed.log 2>&1; then
            echo 'gwk-text compiled with a Unicode table version mismatch' >&2
            exit 1
          fi
          grep -Fq 'error[E0080]' /tmp/unicode-version-seed.log
          grep -Fq 'assertion failed: unicode_tables_match' /tmp/unicode-version-seed.log

          cp /tmp/gwk-text-lib.rs "$source"
          cargo check -p gwk-text --locked
          echo "unicode-version: seeded table mismatch correctly rejected"
      - name: prove the grapheme corpus gate can fail (seeded violation)
        run: |
          set -euo pipefail
          fixture=crates/gwk-text/fixtures/ucd-17.0.0/GraphemeBreakTest.txt
          cp "$fixture" /tmp/GraphemeBreakTest.txt
          trap 'cp /tmp/GraphemeBreakTest.txt "$fixture"' EXIT

          sed -i 's/^÷ 000D × 000A ÷/÷ 000D ÷ 000A ÷/' "$fixture"
          if cargo test -p gwk-text --test unicode_conformance published_grapheme_break_cases_match_the_pinned_unicode_version --locked > /tmp/grapheme-seed.log 2>&1; then
            echo 'grapheme conformance accepted a seeded false boundary' >&2
            exit 1
          fi
          grep -q '\[3.0\]' /tmp/grapheme-seed.log

          cp /tmp/GraphemeBreakTest.txt "$fixture"
          cargo test -p gwk-text --test unicode_conformance --locked
          echo "grapheme-conformance: seeded false boundary correctly rejected"

  # The kernel's ignored integration suite needs a live PostgreSQL superuser:
  # each case creates and initializes its own database plus the runtime role.
  # Keep this separate so service failures do not read as Rust regressions.
  kernel-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWK_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The migrate suite rebuilds the base contract with `git show
          # <revision>:schema/0001_contract.sql` — reconstructing it from
          # history is what makes that proof portable instead of resting on an
          # operator's database dump. A shallow clone has no such revision, so
          # trimming this back reds `admin_migrate` and nothing else.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Assert ignored kernel tests exist
        shell: bash
        run: |
          tests="$(cargo test -p gwk-kernel --locked -- --ignored --list)"
          printf '%s\n' "$tests"
          if ! grep -Eq ': test$' <<<"$tests"; then
            echo 'no ignored gwk-kernel tests were discovered' >&2
            exit 1
          fi
      # The performance envelope is ignored as well and REFUSES a debug profile —
      # its numbers are release-mode evidence — so it has its own job below.
      # Named rather than filtered by target: if it is ever renamed this skip
      # stops matching and the debug run fails loudly, which beats a suite that
      # quietly measures nothing.
      - run: cargo test -p gwk-kernel --locked -- --ignored --skip the_phase_performance_envelope_holds
      # The CLI's live case stands a real daemon up on a temp socket and drives
      # the built binary against it. Same service, separate step, so a failure
      # names which half broke.
      - run: cargo test -p gridwork --locked -- --ignored

  # The accepted performance bounds, in release, against the pinned PostgreSQL
  # major. Sample-level slack stays fixed at 3; it cannot model contention from
  # unrelated work sharing an entire hosted runner. Every run gets two parallel
  # measurements in separate jobs and therefore on independent fresh runners;
  # the `perf` aggregator below remains the stable required check. Two misses are
  # a regression; one miss beside a clean fresh run is runner noise, not a reason
  # to widen slack.
  perf-attempt:
    continue-on-error: true
    outputs:
      outcome: ${{ steps.verdict.outputs.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWK_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
      GWK_PERF_RECEIPT: ${{ github.workspace }}/gwk-perf-receipt.json
      GWK_PERF_REVISION: ${{ github.sha }}
      GWK_PERF_SLACK: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: perf-release
      - id: envelope
        continue-on-error: true
        run: cargo test --release -p gwk-kernel --test perf -- --ignored --nocapture
      # Kept even on failure: a receipt naming which bound collapsed and by how
      # much is the whole point of the job.
      - id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-receipt
          path: gwk-perf-receipt.json
          if-no-files-found: error
      - id: verdict
        if: always()
        env:
          ENVELOPE_OUTCOME: ${{ steps.envelope.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: ./tools/perf-job-guard.sh attempt "$ENVELOPE_OUTCOME" "$RECEIPT_OUTCOME" >> "$GITHUB_OUTPUT"

  perf-retry:
    continue-on-error: true
    outputs:
      outcome: ${{ steps.verdict.outputs.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWK_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
      GWK_PERF_RECEIPT: ${{ github.workspace }}/gwk-perf-receipt-retry.json
      GWK_PERF_REVISION: ${{ github.sha }}
      GWK_PERF_SLACK: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: perf-release
      - id: envelope
        continue-on-error: true
        run: cargo test --release -p gwk-kernel --test perf -- --ignored --nocapture
      - id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-receipt-retry
          path: gwk-perf-receipt-retry.json
          if-no-files-found: error
      - id: verdict
        if: always()
        env:
          ENVELOPE_OUTCOME: ${{ steps.envelope.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: ./tools/perf-job-guard.sh attempt "$ENVELOPE_OUTCOME" "$RECEIPT_OUTCOME" >> "$GITHUB_OUTPUT"

  perf:
    needs: [perf-attempt, perf-retry]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: resolve the two fresh-runner measurements
        run: >-
          ./tools/perf-job-guard.sh final
          "${{ needs.perf-attempt.outputs.outcome }}"
          "${{ needs.perf-retry.outputs.outcome }}"

  # The second platform the kernel claims. Socket behaviour is not portable by
  # assumption — `sun_path` is 104 bytes here and 108 on Linux, a parent
  # directory's mode is enforced differently, and whether the OS will name a
  # peer's credentials at all is per-kernel — so the UDS rules are run rather
  # than reasoned about.
  #
  # Without PostgreSQL: GitHub's macOS runners cannot run service containers, and
  # brew-installing a server would make the slowest job in this file also the one
  # that breaks on runner-image changes instead of on our code. What runs here is
  # everything that needs no server — the socket cases in `listen.rs`, the frame
  # codec and its properties, the domain and the contract — while the
  # server-backed suites stay on Linux above.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Default members — see the note in `test`. macOS would need its own Zig
      # and its own ghostty tree, and gwk-pty's portability is not what this job
      # is here to prove.
      - run: cargo test --all-targets --locked

  # The one crate needing a non-Rust toolchain. Everything it pins lives in
  # crates/gwk-pty/pins.env and is READ from there — a version typed into this
  # file would be a second place for the same number to drift, and the two pins
  # have to move together or the FFI bindings stop matching the C ABI.
  #
  # This job also proves ruling 2's "build-time network access: none". The proof
  # is structural, not a claim: the ghostty tree and the Zig package graph are
  # both materialized BEFORE cargo runs, and the build step then runs with
  # `--offline` and both env vars set. libghostty-vt-sys clones ghostty itself
  # when GHOSTTY_SOURCE_DIR is unset, so leaving it unset is a silent network
  # build — which is exactly the failure the ruling exists to prevent.
  pty:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: load the pins
        run: grep -E '^[A-Z_]+=' crates/gwk-pty/pins.env >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: pty
      # The zig-built engine library is tuned to the CPU that built it — with
      # no -Dtarget, `zig build` resolves the NATIVE cpu model, vector
      # extensions and all — and GitHub's runner fleet mixes
      # microarchitectures, so a cached lib from one runner can SIGILL on the
      # next (observed: gwk-pty-host's test binary, signal 4, on the first
      # restore of a cache another runner had populated). Rust artifacts are
      # target-cpu=generic and stay cached; only the sys crate's build output
      # and fingerprint are wiped, so the zig build reruns on THIS machine
      # from the cached source tree and package graph.
      - name: never reuse a machine-tuned engine lib from cache
        run: rm -rf target/debug/build/libghostty-vt-sys-* target/debug/.fingerprint/libghostty-vt-sys-*
      # Registry crates come down here, with the network, exactly as every other
      # job gets them. Populating a package cache is not a build.
      #
      # BEFORE the pin checks, not after: one of them reads the resolved
      # libghostty-vt-sys out of the dependency graph, and the graph is not
      # readable until its crates are on disk.
      - name: fetch registry dependencies
        run: cargo fetch --locked
      # Always, cache hit or not — the point is to catch a Cargo.toml edit that
      # never reaches the materialize step below, and to refuse to materialize a
      # ghostty tree whose revision has not been checked against the bindings that
      # will be compiled against it. `--env` does no work; it runs the assertions.
      - name: the pins agree with Cargo.toml and with libghostty-vt-sys
        run: ./tools/pty-toolchain.sh --env > /dev/null
      - name: prove the pin checks can fail
        run: |
          set -euo pipefail
          trap 'git checkout -- Cargo.toml crates/gwk-pty/pins.env' EXIT

          seed() { # seed <label>; expects the tree already edited
            if ./tools/pty-toolchain.sh --env > /dev/null 2>&1; then
              echo "pty-toolchain: accepted $1 — the check is decoration" >&2
              exit 1
            fi
            echo "  rejected: $1"
          }

          sed -i 's/^libghostty-vt = "=.*"$/libghostty-vt = "=0.0.0-seeded"/' Cargo.toml
          seed "a desynced wrapper version"
          git checkout -- Cargo.toml

          sed -i 's/^libghostty-vt = "=.*"$/libghostty-vt = "^0.2.0"/' Cargo.toml
          seed "a caret range where an exact pin is required"
          git checkout -- Cargo.toml

          # The realistic drift, not an invented one: fdbf9ff3 is the revision
          # libghostty-vt-sys 0.2.0 pins, so this is the tree we would be building
          # if resolution had landed one version earlier.
          sed -i 's/^GHOSTTY_COMMIT=.*/GHOSTTY_COMMIT=fdbf9ff3a31d7531b691cb49c98fc465a1a503a0/' crates/gwk-pty/pins.env
          seed "a real but WRONG ghostty revision"
          git checkout -- crates/gwk-pty/pins.env

          # Positive control: every seed above would also "fail correctly" against
          # a script that simply always exited non-zero.
          ./tools/pty-toolchain.sh --env > /dev/null
          echo "the pin checks reject each seed and accept the real pins"
      # Keyed on the ghostty revision, so a re-pin invalidates it and nothing
      # else does. Restoring beats a 71 MB clone plus a ~560 MB package fetch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ghostty-cache
        with:
          path: |
            .ghostty
            .zig-packages
          key: ghostty-${{ env.GHOSTTY_COMMIT }}-zig-${{ env.ZIG_VERSION }}
      # The same script a contributor runs. A second copy of this logic inline
      # would drift the first time one side gained a flag.
      - name: materialize the pinned ghostty tree and its Zig package graph
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: ./tools/pty-toolchain.sh
      # The actual proof that the build reaches no network. `tools/no-network.sh`
      # runs its argument in a namespace with no interfaces and REFUSES to run it
      # at all if it cannot make one — see the header there for why `--offline`
      # alone would prove something adjacent to the claim rather than the claim.
      - name: build and test with no network
        run: |
          set -euo pipefail
          eval "$(./tools/pty-toolchain.sh --env)"
          # The adapter crates ride this job, not `test`: depending on gwk-pty
          # makes them need the same Zig toolchain, and their tests must hold
          # inside the same no-network namespace — an adapter that reached for
          # an engine or a network here would be exactly the dependency this
          # phase's public CI must never acquire. gwk-parity depends on all
          # three adapters (inheriting the same Zig need) and rides here for
          # the same reason: its OWN pure library and seeded-negative tests
          # must hold offline, and `--all-targets` compiles its `#[ignore]`d
          # live runners (`tests/*.rs`) without ever running them — this loop
          # never passes `--ignored`, so no engine binary or network path is
          # acquired here, exactly `docs/PARITY.md`'s own split.
          ./tools/no-network.sh bash -euo pipefail -c '
            for crate in gwk-pty gwk-adapter-opencode gwk-adapter-claude gwk-adapter-codex gwk-parity; do
              cargo clippy -p "$crate" --all-targets --locked --offline -- -D warnings
              cargo test -p "$crate" --all-targets --locked --offline
              cargo test -p "$crate" --doc --locked --offline
            done
          '
      # The two sorted-key guards in `gwk-kernel`'s checkpoint module CANNOT
      # fail in a default build: with `serde_json::Map` backed by `BTreeMap` the
      # uncanonicalized bytes already equal the canonical ones, so deleting the
      # sort leaves them green. They only discriminate where `preserve_order` is
      # unified in — which is THIS job, because `gwk-adapter-opencode` pulls it
      # through agent-client-protocol. So run them here, against the map backing
      # a joint build actually produces.
      #
      # The premise is PROVED, not inferred. Reading `cargo tree` would only show
      # that the adapter's graph asks for the feature — one step removed from the
      # claim that matters, which is that the binary these guards just ran in
      # linked an insertion-ordered map. So seed the violation instead: reverse
      # the comparator, require both guards to CATCH it here, on this runner,
      # then restore and require them to pass. A lane that stopped being poisoned
      # then fails loudly rather than going quietly green, which is the whole
      # reason this step exists. Restoring through a trap, and with a `touch`,
      # because copy-back preserves mtime and cargo would reuse the mutated
      # build.
      #
      # A filter that matched nothing exits 0 too, so both guards are also
      # checked by name in the run's own output rather than trusted to a
      # zero-test success.
      - name: the checkpoint digest holds under a preserve_order build
        run: |
          set -euo pipefail
          eval "$(./tools/pty-toolchain.sh --env)"
          guarded=crates/gwk-kernel/src/checkpoint.rs
          original=/tmp/checkpoint-rs.original
          cp "$guarded" "$original"
          restore() { cp "$original" "$guarded"; touch "$guarded"; }
          trap restore EXIT

          sed -i 's/entries.sort_by(|(a, _), (b, _)| a.cmp(b));/entries.sort_by(|(a, _), (b, _)| b.cmp(a));/' "$guarded"
          if ! grep -Fq 'entries.sort_by(|(a, _), (b, _)| b.cmp(a));' "$guarded"; then
            echo 'the seeded comparator did not land — the sort was renamed and this control proves nothing' >&2
            exit 1
          fi
          touch "$guarded"
          if cargo test -p gwk-kernel -p gwk-adapter-opencode --lib --locked --offline checkpoint:: >/dev/null 2>&1; then
            echo 'the guards accepted a REVERSED key comparator: this lane is not linking the insertion-ordered map, so both guards below are vacuous here and nothing is checking the digest' >&2
            exit 1
          fi
          restore

          out=$(cargo test -p gwk-kernel -p gwk-adapter-opencode --lib --locked --offline checkpoint:: 2>&1) || {
            printf '%s\n' "$out" >&2
            exit 1
          }
          printf '%s\n' "$out"
          for guard in an_ingested_payload_is_hashed_by_sorted_keys_discriminating_only_under_preserve_order \
                       a_message_payload_is_hashed_by_sorted_keys_discriminating_only_under_preserve_order; do
            # A herestring, not `printf | grep -q`: grep exits on its first match
            # and closes the pipe, printf takes SIGPIPE, and `pipefail` turns a
            # guard that PASSED into a 141 the `!` reads as failure.
            if ! grep -Fq "$guard ... ok" <<<"$out"; then
              echo "$guard did not run here — the filter matched nothing and the step is decoration" >&2
              exit 1
            fi
          done
          echo 'the checkpoint digest is key-order independent under the poisoned backing; both guards ran, and both caught a seeded reversal'
      # The conformance corpus is only a gate if it can fail. The step above
      # already RAN it; these seeds show it says no to the three ways it could
      # be hollowed out — a frame that stopped matching the parser, a fixture
      # edited to agree with a doctored frame, and a corpus that quietly lost a
      # vector.
      #
      # No network namespace here. The seeds are about the gate's judgement,
      # not about where its bytes came from, and the build they need already
      # happened above.
      - name: prove the conformance gate can fail
        run: |
          set -euo pipefail
          eval "$(./tools/pty-toolchain.sh --env)"
          trap 'git checkout -- crates/gwk-pty/fixtures' EXIT

          conformance() {
            cargo test -p gwk-pty --test conformance --locked --offline > /dev/null 2>&1
          }
          seed() { # seed <label>; expects the tree already edited
            if conformance; then
              echo "conformance: accepted $1 — the gate is decoration" >&2
              exit 1
            fi
            echo "  rejected: $1"
          }

          sed -i '0,/^cursor /s/^cursor .*/cursor 77,7/' crates/gwk-pty/fixtures/golden-frames.txt
          seed "a golden frame that disagrees with the parser"
          git checkout -- crates/gwk-pty/fixtures

          # The direction a frame comparison alone cannot see: making the INPUT
          # agree with a frame rather than the other way round. Appending to the
          # hex payload leaves the digest on that line describing something else.
          sed -i 's/^\(23-empty [0-9a-f]* [0-9a-f]*\)$/\178/' crates/gwk-pty/fixtures/stream-initial.hex
          seed "a vector edited after its frame was captured"
          git checkout -- crates/gwk-pty/fixtures

          sed -i '/^01-plain-text-slice /d' crates/gwk-pty/fixtures/stream-initial.hex
          seed "a vector missing from the corpus"
          git checkout -- crates/gwk-pty/fixtures

          # Positive control: all three seeds would also "fail correctly"
          # against a test that could never pass at all.
          conformance
          echo "the conformance gate rejects each seed and accepts the real corpus"
      # The reattach gate gets the same treatment. Its assertions live in the
      # attach unit tests rather than a fixture file, so the seeds edit the code
      # under test — which adds a failure mode fixtures don't have: a seed that
      # breaks the BUILD also exits non-zero, proving compilation and nothing
      # about the gate's judgement. So each seed must fail through the named
      # test, not merely fail.
      #
      # Two seeds, one per assertion family: replay fidelity (the resize is the
      # case a byte-only stream gets wrong) and snapshot fidelity (the fallback
      # branch a client past the retention horizon takes). The protocol-choice
      # asserts (`CaughtUp` variants) ride the same tests these seeds prove can
      # fail.
      - name: prove the reattach gate can fail
        run: |
          set -euo pipefail
          eval "$(./tools/pty-toolchain.sh --env)"
          trap 'git checkout -- crates/gwk-pty/src' EXIT

          attach_tests() {
            cargo test -p gwk-pty --lib --locked --offline attach:: 2>&1
          }
          seed() { # seed <label> <test that must catch it>; expects the tree already edited
            local out
            if out=$(attach_tests); then
              echo "reattach: accepted $1 — the gate is decoration" >&2
              exit 1
            fi
            if ! printf '%s' "$out" | grep -q "$2"; then
              echo "reattach: rejected $1, but not through $2:" >&2
              printf '%s\n' "$out" | tail -25 >&2
              exit 1
            fi
            echo "  rejected: $1 (caught by $2)"
          }

          sed -i 's/Event::Resize { cols, rows } => grid\.resize(\*cols, \*rows)?,/Event::Resize { .. } => {},/' crates/gwk-pty/src/attach.rs
          seed "a replay that drops resizes" "a_returning_client_replays_the_gap_including_a_resize"
          git checkout -- crates/gwk-pty/src

          sed -i 's/snapshot: grid\.snapshot_vt()?,/snapshot: Vec::new(),/' crates/gwk-pty/src/attach.rs
          seed "a snapshot that stopped carrying the screen" "a_second_client_attaches_to_the_screen_already_on_show"
          git checkout -- crates/gwk-pty/src

          # Positive control: both seeds would also "fail correctly" against a
          # suite that no longer compiles or never passed.
          attach_tests > /dev/null
          echo "the reattach gate rejects each seed and accepts the real code"

  # `gwk-pty-host` is a workspace member but not a DEFAULT member (see the note
  # in the root Cargo.toml) — on the same policy as `pty`: `test`/`msrv`/
  # `package` build only default members, so a crate absent from that list is
  # silently unbuilt and untested by every one of them unless something else
  # names it. This job is that something else. Since the host runtime wired in
  # gwk-pty and the adapters, this job ALSO needs the pinned engine toolchain —
  # the same pins, cache, and materialize steps as `pty`, one script so the two
  # cannot drift.
  pty-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: load the pins
        run: grep -E '^[A-Z_]+=' crates/gwk-pty/pins.env >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: pty
      # Same reason as the `pty` job: the zig-built engine lib is native-CPU
      # tuned and must not cross runners inside the rust cache.
      - name: never reuse a machine-tuned engine lib from cache
        run: rm -rf target/debug/build/libghostty-vt-sys-* target/debug/.fingerprint/libghostty-vt-sys-*
      - name: fetch registry dependencies
        run: cargo fetch --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ghostty-cache
        with:
          path: |
            .ghostty
            .zig-packages
          key: ghostty-${{ env.GHOSTTY_COMMIT }}-zig-${{ env.ZIG_VERSION }}
      - name: materialize the pinned ghostty tree and its Zig package graph
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: ./tools/pty-toolchain.sh
      - name: fmt, clippy, test
        run: |
          set -euo pipefail
          eval "$(./tools/pty-toolchain.sh --env)"
          cargo fmt -p gwk-pty-host --check
          cargo clippy -p gwk-pty-host --all-targets --locked -- -D warnings
          cargo test -p gwk-pty-host --all-targets --locked
          cargo test -p gwk-pty-host --doc --locked
      # A crate silently dropped from `default-members` and named nowhere else
      # is a crate no job builds — the exact hole this job exists to close.
      # Prove it by breaking the crate and watching THIS job go red, not by
      # trusting that the commands above would notice.
      - name: prove this job goes red when the crate breaks
        run: |
          set -euo pipefail
          eval "$(./tools/pty-toolchain.sh --env)"
          trap 'git checkout -- crates/gwk-pty-host/src/lib.rs' EXIT
          printf '\npub fn seeded_compile_error( {\n' >> crates/gwk-pty-host/src/lib.rs
          if cargo test -p gwk-pty-host --all-targets --locked > /dev/null 2>&1; then
            echo 'gwk-pty-host built clean with a seeded compile error in it — this job cannot fail' >&2
            exit 1
          fi
          echo "pty-host: seeded breakage correctly rejected"

  # Criterion 4, executable: `cargo install gridwork` has to work for someone who
  # has never heard of Zig. Every other job happens to run on a runner without
  # Zig, which makes the claim true BY ACCIDENT — nothing there would notice if it
  # stopped being true for the right reason. This job makes both halves explicit:
  # it asserts Zig is absent (so it cannot pass vacuously on a runner that shipped
  # it) and it seeds the dependency that would break the claim (so it cannot pass
  # emptily either).
  #
  # Not redundant with the `cargo tree` assertion in `test`. That one reads the
  # dependency GRAPH; this one runs the BUILD. A transitive route to a
  # Zig-requiring crate that `cargo tree -p gridwork` renders in a shape the grep
  # does not match would slip past the graph check and fail here.
  zig-free:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: zig must be absent, or this job tests nothing
        run: |
          set -euo pipefail
          if command -v zig > /dev/null; then
            echo "zig is on PATH — this runner cannot test the Zig-free claim" >&2
            exit 1
          fi
          echo "zig is not on PATH"
      # The positive control for the seed below: the install path builds here, on
      # this runner, with no Zig anywhere.
      - name: the install path builds
        run: cargo build -p gridwork --locked
      - name: prove this job would catch gwk-pty entering the graph
        run: |
          set -euo pipefail
          trap 'git checkout -- crates/gridwork/Cargo.toml Cargo.lock' EXIT
          sed -i '/^\[dependencies\]/a gwk-pty = { path = "../gwk-pty" }' crates/gridwork/Cargo.toml
          # No `--locked`: the seed adds a dependency edge, which rewrites the lock.
          if out=$(cargo build -p gridwork 2>&1); then
            echo "gridwork built WITH gwk-pty and no Zig — this job cannot fail" >&2
            exit 1
          fi
          # It is not enough that the seeded build failed. It has to fail FOR WANT
          # OF ZIG, or the seed is only proving that a broken manifest breaks a
          # build — which would stay green if the Zig requirement quietly went away.
          #
          # Matched on `zig build`, the command libghostty-vt-sys reports it could
          # not execute, NOT on the bare string `zig`: cargo echoes the checkout
          # path on every Compiling line, so a bare match passes whenever the
          # working directory happens to contain those three letters. That is not
          # hypothetical — it fired on a local worktree named `gridwork-zigfree`,
          # in a runner path where it would have looked fine forever.
          if ! printf '%s' "$out" | grep -qi 'zig build'; then
            echo "the seeded build failed, but not for want of Zig:" >&2
            printf '%s\n' "$out" | tail -25 >&2
            exit 1
          fi
          echo "a seeded gwk-pty dependency correctly fails for want of Zig"

  # What a crates.io consumer actually receives. `cargo package` verifies by
  # building the packaged LIB, which is why it passed for a year while
  # `gwk-domain`'s own DDL test reached `../../../schema/` — a path that exists
  # in the repo and not in the tarball. So this builds the packaged crate's TEST
  # targets, which is the thing that was broken, and asserts the LICENSE rode
  # along (a root-level file is outside every package root; the per-crate ones
  # are symlinks, and cargo archives them as real files).
  #
  # Both crate lists are DERIVED, never typed. A hardcoded list is a gate that
  # silently stops covering the next crate someone adds, which is the same
  # failure shape as a check that cannot fail.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: every published crate builds alone and carries its license and readme
        run: |
          set -euo pipefail
          # `--workspace`, not a per-crate loop. The kernel and the CLI depend on
          # siblings at a version that reaches crates.io only when the release
          # lands, and only this form resolves those against the locally built
          # packages. It also VERIFIES each crate by building it from its own
          # tarball — the one place feature unification is OFF. That is how
          # gwk-kernel 0.0.1 could pass every other job while missing
          # `tokio/macros`: the workspace build handed it the feature that
          # `gridwork` had enabled, and no job ever built the crate on its own.
          #
          # `--exclude gwk-pty` is NOT redundant with its `publish = false`.
          # `cargo package --workspace` packages unpublishable members too — it
          # only declines to upload them — and packaging runs the verify build,
          # which for this crate means Zig and a 71 MB ghostty tree. The derived
          # loops below DO filter on `publish`, so they need no exclusion; this
          # line does. Verified by observation, not by reading the flag's name.
          # gwk-pty-host joined the list when it took the engine and adapter
          # path dependencies: packaging demands version requirements those
          # unpublished siblings do not have.
          #
          # xtask joined for the same reason by the same route, one crate later:
          # it took a path dependency on gwk-context, which is `publish = false`
          # until E3 lands the wire-v2 grammar. Both ways out of that bind are
          # closed, which is why the exclusion is the answer and not a manifest
          # tweak — declare a version on gwk-context and packaging resolves it
          # from the crates.io index, where an unpublished crate is not; omit
          # the version and packaging refuses the dependency for having none. A
          # crate that is never uploaded owes neither check an answer.
          #
          # gwk-context-compiler is the same bind one crate later: it is
          # `publish = false` BECAUSE it depends on gwk-context by path, and it
          # is a separate crate so the verifier's dependency graph can exclude
          # it (the verifier-independence rule) — an exclusion that only means something if the crate is
          # a real workspace member, which is why it is one and not a module.
          #
          # gwk-context-verifier is the third link in that same chain and joins
          # for the identical reason, not as a new class of exemption: it path-
          # depends on gwk-context, so packaging it hits the same closed pair of
          # exits described above.
          cargo package --workspace --exclude gwk-pty \
            --exclude gwk-adapter-opencode --exclude gwk-adapter-claude \
            --exclude gwk-adapter-codex --exclude gwk-parity \
            --exclude gwk-pty-host --exclude xtask \
            --exclude gwk-context-compiler --exclude gwk-context-verifier \
            --locked

          # Every publishable member, straight from the manifest graph:
          # `publish = false` shows up as an empty array, so xtask drops out and
          # a newly added crate is covered the day it exists.
          cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.publish != []) | .name' > /tmp/publishable

          while read -r crate; do
            version=$(cargo metadata --format-version 1 --no-deps \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            # Listed to a file, not piped into `grep -q`: grep would exit on the
            # match, tar would take SIGPIPE, and `pipefail` would read that as a
            # failed package.
            tar tzf "target/package/$crate-$version.crate" > /tmp/crate-files
            grep -qx "$crate-$version/LICENSE" /tmp/crate-files
            grep -qx "$crate-$version/README.md" /tmp/crate-files
            # README.md promises the sample stream ships inside the crate.
            if [ "$crate" = gwk-cert ]; then
              grep -qx "$crate-$version/fixtures/valid-stream.json" /tmp/crate-files
            fi
          done < /tmp/publishable

          # Building the TESTS from the tarball only works for crates with no
          # unpublished sibling: the others resolve that sibling from crates.io,
          # at the version the release is in the middle of introducing. That is
          # not a hypothetical — it is how this job first failed. `cargo package
          # --workspace` above already built every crate's lib from its own
          # tarball against the local packages, which is the check that matters.
          #
          # "No unpublished sibling" is exactly "no path dependency", so derive
          # it rather than restating it as a list that drifts.
          cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[]
                     | select(.publish != [])
                     | select([.dependencies[] | select(.path != null)] | length == 0)
                     | .name' > /tmp/no-sibling

          while read -r crate; do
            version=$(cargo metadata --format-version 1 --no-deps \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            ( cd "target/package/$crate-$version" && cargo build --tests --locked )
          done < /tmp/no-sibling

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Default members — see the note in `test`. NOTHING checks gwk-pty's MSRV:
      # the `pty` job builds it on stable, and this job cannot reach it without
      # the Zig toolchain. Stated rather than papered over — the crate is not
      # published, so nobody is relying on an MSRV it does not advertise, and the
      # honest fix is a 1.94 leg on the `pty` job if that ever stops being true.
      - run: cargo check --all-targets --locked

  # The DDL is contract: it must apply clean against the pinned postgres major.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Digest-pinned like every action above; Renovate tracks the postgres:16
        # tag, and holds the major behind a `major-bump` label rather than
        # proposing postgres:18 as routine.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: psql "postgresql://postgres:ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f schema/0001_contract.sql
      # Row-level DELETE guards never fire on TRUNCATE; the state tables need a
      # statement-level BEFORE TRUNCATE cover to stay append-only. This single
      # psql -c MUST fail — a passing TRUNCATE means the guard on gwk.command regressed.
      - name: TRUNCATE on the command state table must error
        run: |
          if psql "postgresql://postgres:ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c 'TRUNCATE gwk.command;'; then
            echo 'TRUNCATE gwk.command succeeded — the state-table truncate guard is missing' >&2
            exit 1
          fi
      # A lease fence, once set, must never be cleared or lowered — a
      # 100 -> NULL -> 50 launder would otherwise rewind it past the "< OLD"
      # check and re-arm a deposed writer. Seed a fence, then the clear MUST
      # fail; a passing clear means the fence no-clear/monotonic guard regressed.
      - name: Clearing a set lease fence must error
        run: |
          PGURL="postgresql://postgres:ci@localhost:5432/postgres"
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "INSERT INTO gwk.lease (id, version, fence_token) VALUES ('ci-fence', 1, 100);"
          if psql "$PGURL" -v ON_ERROR_STOP=1 -c "UPDATE gwk.lease SET version=2, fence_token=NULL WHERE id='ci-fence';"; then
            echo 'clearing a set lease fence_token succeeded — the fence no-clear/monotonic guard regressed' >&2
            exit 1
          fi

  # The generated TypeScript contract, goldens, and theme must match the Rust
  # source exactly (xtask --check), decode at runtime under bun, typecheck
  # under exactOptionalPropertyTypes, and stay in sync with the site tokens.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: cargo run --locked -p xtask -- contract --check
      # A guard nobody has watched fail is a guard nobody has tested. Move the
      # contract digest and confirm --check refuses it for want of a migration
      # step — the state a real contract change lands in, since the SQL is
      # edited before the step that carries a database across it is written.
      - name: prove the missing-step gate can fail (seeded violation)
        run: |
          set -euo pipefail
          log=$(mktemp)
          printf '\n-- seeded: a contract change with no step\n' >> schema/0001_contract.sql
          # Regenerate FIRST. A bare --check after an SQL edit is red on
          # contract_sql.rs drift alone — which would let this control pass while
          # the missing-step gate is decoration.
          cargo run --locked -p xtask -- contract
          if cargo run --locked -p xtask -- contract --check 2>"$log"; then
            echo 'the contract digest moved and --check stayed green' >&2
            exit 1
          fi
          if ! grep -q 'no migration step results in' "$log"; then
            echo 'the check failed, but not for want of a step:' >&2
            cat "$log" >&2
            exit 1
          fi
          git checkout -- schema/0001_contract.sql crates/gwk-domain/src/contract_sql.rs
          echo "contract: a digest with no step is correctly rejected"
      - run: bun install --frozen-lockfile
        working-directory: contracts
      - run: bun test
        working-directory: contracts
      # bun test re-emits goldens-ts/; any difference from the committed
      # files means the TS decode path changed what it read.
      - run: git diff --exit-code contracts/goldens-ts
      - run: bun x tsc --noEmit
        working-directory: contracts
      - run: ./tools/check-theme-sync.sh

  # The site must install with Bun, generate Fumadocs sources, build Next's
  # standalone output, and serve the production routes with the header floor.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # The export build below runs the same gate inside `bun run build`; this
      # leg runs it first so a stale mirror fails before the build, and so the
      # SEEDED violations further down have a clean baseline to start from.
      - name: docs mirror freshness gate
        working-directory: site
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check:docs
      # `site/package.json` has defined this script and `site/README.md` has
      # told contributors to run it since the project landed, and no workflow
      # invoked it. The export build below runs `next build`, which does NOT
      # type-check — so nothing here ever read a type error.
      #
      # `next typegen` first is not optional: it writes the generated route
      # types `tsc` then resolves against, and a bare `tsc --noEmit` fails on
      # their absence rather than on anything a contributor wrote.
      - name: typecheck
        working-directory: site
        run: |
          set -euo pipefail
          # The documented contributor command verbatim — site/README.md tells
          # people to run this exact script, so CI running something adjacent
          # would let the two drift.
          bun run typecheck

          # A green `tsc` is not evidence it read anything. An empty project
          # exits 0, and `site/` now runs TypeScript 7 — the Go port, which
          # ships no JavaScript compiler API, so every consumer that imported
          # `typescript` as a library is retargeted by the bump alone. Next
          # refused outright and needed `experimental.useTypeScriptCli`, which
          # is the good case; the same removal took another project's module
          # graph from 151 to 0 with exit 0 and no message. So count the files,
          # and let the count decide.
          checked="$(bunx tsc --noEmit --listFiles |
            grep -v '/node_modules/' | grep -cv '/\.next/' || true)"
          # 21 today. The floor is deliberately far below that rather than
          # just under it: the failure being guarded lands at zero or a
          # handful, so a tight floor buys nothing and reds on ordinary churn.
          echo "typecheck: ${checked} project files"
          if [ "${checked:-0}" -lt 10 ]; then
            echo "typecheck: only ${checked} project files reached tsc — it is checking nothing" >&2
            exit 1
          fi
      # Dead files, dead exports, dead dependencies. Wired here rather than
      # left as a config file someone runs by hand, which is the state
      # `typecheck` above was in. Its first run found a real dead export.
      - name: knip
        working-directory: site
        run: |
          set -euo pipefail
          bun run knip
      - name: check design tokens
        working-directory: site
        run: |
          set -euo pipefail
          bun run check:tokens
      - name: prove the freshness gate can fail (seeded violations)
        working-directory: site
        run: |
          set -euo pipefail
          trap 'git checkout -- content/docs ../ROADMAP.md; rm -f ../docs/derivation/reviews/.seeded-record.md' EXIT

          # Corrupted mirror content: the map registers each curated page's own
          # bytes, so a mirror edited without re-registration is red. The first
          # version of this gate checked the mirror for existence only, and a
          # corrupted mirror passed it green.
          printf '\nseeded stale paragraph\n' >> content/docs/roadmap.mdx
          out=""
          if out="$(bun run check:docs 2>&1)"; then
            echo 'freshness gate accepted corrupted mirror content — the gate is broken' >&2
            exit 1
          fi
          grep -q 'mirror content drifted' <<<"$out" || {
            echo "corrupted mirror was rejected, but not by the registration hash:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          }
          git checkout -- content/docs
          echo "docs-freshness: corrupted mirror correctly rejected"

          # The incident shape: the canonical source moves and the mirror does
          # not. The curated-from binding lives INSIDE the mirror, so going
          # green requires editing the mirror file itself — there is no map
          # digest left to refresh around it.
          printf '\nseeded source drift\n' >> ../ROADMAP.md
          if out="$(bun run check:docs 2>&1)"; then
            echo 'freshness gate accepted a moved source under an untouched mirror — the gate is broken' >&2
            exit 1
          fi
          grep -q 'stale curated docs: content/docs/roadmap.mdx' <<<"$out" || {
            echo "the stale mirror was rejected, but not through its curated-from binding:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          }
          git checkout -- ../ROADMAP.md
          echo "docs-freshness: stale mirror correctly rejected"

          # A new file in a mirrored DIRECTORY source. The reviews mirror binds
          # the whole tree's listing digest; a map that enumerated the records
          # one by one silently stopped covering the tree the day the next
          # record landed.
          printf 'seeded record\n' > ../docs/derivation/reviews/.seeded-record.md
          if out="$(bun run check:docs 2>&1)"; then
            echo 'freshness gate accepted a new file in a mirrored directory — the gate is broken' >&2
            exit 1
          fi
          grep -q 'stale curated docs: content/docs/derivation/reviews.mdx' <<<"$out" || {
            echo "the directory growth was rejected, but not through the reviews binding:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          }
          rm -f ../docs/derivation/reviews/.seeded-record.md
          echo "docs-freshness: unwatched directory growth correctly rejected"

          # Positive control: three seeds that can only fail would also pass
          # with the checker replaced by `exit 1`.
          bun run check:docs
          echo "docs-freshness: the live tree is fresh"
      # Built WITH the SHA, the same way .github/workflows/site.yml builds a deploy. The
      # value is baked into the exported /health file at `next build`; a build that dropped
      # it still exports a /health that answers 200 with a cheerful "unknown", which is how
      # a six-commit-stale build once sat in production unnoticed. So the smoke below reads
      # it back and compares.
      - name: build the static export
        working-directory: site
        env:
          GRIDWORK_GIT_SHA: ${{ github.sha }}
        run: bun run build
      # wrangler runs on Node; the runner image's default Node is older than wrangler 4 needs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      # out/ served the way production serves it: through the Workers asset handler, in
      # wrangler's local mode (no account, no network beyond the package download). Every
      # route in the built sitemap, the full security-header set, the not-found page and the
      # /health SHA are checked by scripts/smoke.sh — the same script run by hand against a
      # deployed URL.
      - name: smoke the export under the Workers asset handler
        working-directory: site
        env:
          GIT_SHA: ${{ github.sha }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          pids=()
          trap 'for p in "${pids[@]}"; do kill "$p" 2>/dev/null || true; done' EXIT
          serve() {
            local port="$1"
            bunx wrangler@4.141.0 dev --ip 127.0.0.1 --port "$port" > "$RUNNER_TEMP/wrangler-$port.log" 2>&1 &
            pids+=("$!")
            for _ in $(seq 1 90); do
              curl -fsS -o /dev/null "http://127.0.0.1:$port/" 2>/dev/null && return 0
              sleep 1
            done
            echo "site smoke: wrangler dev on $port did not come up" >&2
            tail -40 "$RUNNER_TEMP/wrangler-$port.log" >&2
            return 1
          }

          serve 8787
          bash scripts/smoke.sh http://127.0.0.1:8787 "$GIT_SHA"

          # The smoke must be able to fail. A wrong expected SHA must be refused, or the
          # comparison above is decoration.
          if bash scripts/smoke.sh http://127.0.0.1:8787 0000000000000000000000000000000000000000 2>/dev/null; then
            echo "site smoke: accepted a /health SHA that is not the built commit — the check is broken" >&2
            exit 1
          fi
          # And a missing security header must be refused: serve a copy of the export with one
          # _headers line removed and require the same script to go red on it.
          cp -r out "$RUNNER_TEMP/out-seeded"
          sed -i '/^  Referrer-Policy:/d' "$RUNNER_TEMP/out-seeded/_headers"
          mv out "$RUNNER_TEMP/out-good"
          mv "$RUNNER_TEMP/out-seeded" out
          serve 8788
          if bash scripts/smoke.sh http://127.0.0.1:8788 "$GIT_SHA" 2>/dev/null; then
            echo "site smoke: accepted an export missing Referrer-Policy — the header check is broken" >&2
            exit 1
          fi
          rm -rf out
          mv "$RUNNER_TEMP/out-good" out
          echo "site smoke: a wrong SHA and a dropped security header are both refused"

  # The house lint, format, and config-vendoring floor. Wired here
  # rather than left as scripts someone runs by hand, which is the state `typecheck`
  # sat in until #120 — configured, documented, and never once invoked by CI.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # oxlint and oxfmt are pinned once, in site/package.json. There is no root
      # package.json — three independent projects share this checkout — so both
      # scripts resolve the binaries under site/ and run from the repo root, which
      # is the only cwd where the configs and .prettierignore are discovered.
      - name: install pinned tooling
        working-directory: site
        run: bun install --frozen-lockfile
      - name: lint
        run: ./tools/lint.sh .
      - name: format
        run: ./tools/format.sh --check
      # Two tests, neither of which the linter stands in for. The drift gate proves
      # the vendored house configs still match their recorded bytes; the load test
      # proves the vendored jsPlugin actually loads under this repo's oxlint build
      # and that its rules fire.
      - name: vendored-config and plugin-load tests
        run: bun test tools/
      - name: prove the gates can fail (seeded violations)
        run: |
          set -euo pipefail
          trap 'git checkout -- .oxfmtrc.json site/app/layout.tsx; [ -d contracts ] || mv ../contracts-moved contracts' EXIT

          # A lint finding from the VENDORED PLUGIN's own rules, not a built-in one.
          # A built-in seed would go red whether or not plugin.js loaded, and a
          # jsPlugin that fails to load is silent — oxlint reports nothing and exits
          # 0. This is the one seed that would catch that through the real gate.
          printf '\nexport const seeded = AbortSignal.timeout(1);\n' >> site/app/layout.tsx
          out=""
          if out="$(./tools/lint.sh . 2>&1)"; then
            echo 'lint accepted a seeded finding — the gate is broken' >&2
            exit 1
          fi
          grep -q 'no-abortsignal-timeout' <<<"$out" || {
            echo "the seed was rejected, but not by the vendored plugin's rule:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          }
          git checkout -- site/app/layout.tsx
          echo "lint: a vendored-plugin finding correctly rejected"

          # Unformatted source. `--check` is the only thing standing between this
          # repo and a formatter nobody runs.
          printf '\nexport const seeded  =   1\n' >> site/app/layout.tsx
          if ./tools/format.sh --check >/dev/null 2>&1; then
            echo 'format accepted unformatted source — the gate is broken' >&2
            exit 1
          fi
          git checkout -- site/app/layout.tsx
          echo "format: unformatted source correctly rejected"

          # A tree that moved. oxfmt does not fail on a path matching nothing, so a
          # renamed directory otherwise just stops being formatted — silently, and
          # green. The count cannot cover this: dropping `contracts` costs 3 of 25
          # files, which no floor low enough to survive churn would ever catch. So
          # the trees are asserted to exist by name, and this moves one to prove it.
          mv contracts ../contracts-moved
          if out="$(./tools/format.sh --check 2>&1)"; then
            echo 'format accepted a missing tree — the gate is broken' >&2
            exit 1
          fi
          grep -q 'aimed at a tree that moved' <<<"$out" || {
            echo "the missing tree was rejected, but not by the existence check:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          }
          mv ../contracts-moved contracts
          echo "format: a moved tree correctly rejected"

          # An empty scan. Both tools exit 0 having read nothing, so neither exit
          # code is evidence on its own and the file count has to decide. Raising
          # the floor above the real count stands in for the tree emptying out.
          if LINT_FLOOR=9999 ./tools/lint.sh . >/dev/null 2>&1; then
            echo 'lint accepted a count below its floor — the gate is broken' >&2
            exit 1
          fi
          if FMT_FLOOR=9999 ./tools/format.sh --check >/dev/null 2>&1; then
            echo 'format accepted a count below its floor — the gate is broken' >&2
            exit 1
          fi
          echo "lint/format: an empty scan correctly rejected"

          # Drift in a vendored config, proven under the conditions this runner has:
          # no canonical checkout exists here, so the recorded digests are the only
          # half of the drift gate that runs. Before they existed the whole suite
          # skipped, and a vendored config edited on a branch reached main green.
          printf '\n' >> .oxfmtrc.json
          if bun test tools/vendored-config-drift.test.ts >/dev/null 2>&1; then
            echo 'drift gate accepted an edited vendored config — the gate is broken' >&2
            exit 1
          fi
          git checkout -- .oxfmtrc.json
          echo "drift: an edited vendored config correctly rejected"

          # Positive control: six seeds that can only fail would also pass with every
          # script here replaced by `exit 1`.
          ./tools/lint.sh .
          ./tools/format.sh --check
          bun test tools/
          echo "lint: the live tree is clean"

  # One of the two required contexts for branch protection; security.yml's
  # `security` aggregates the supply-chain, leak and clean-room gates.
  #
  # `if: always()` is load-bearing, and it is the same trap `cleanroom-gate`
  # (security.yml) documents from the other direction: a job left on the default
  # `success()` condition SKIPS when a dependency fails, and GitHub reports a
  # skipped required check as SUCCESS. Such an aggregator goes green by not
  # running — it would report nothing at exactly the moment it matters.
  #
  # `perf-attempt` and `perf-retry` are deliberately absent from `needs:`. Both
  # are `continue-on-error: true`, so their result reads `success` here even
  # when their steps fail; listing them would look like coverage while
  # asserting nothing. `perf` is the rollup that actually decides, and it is
  # listed.
  verify:
    if: always()
    needs:
      - contract
      - kernel-integration
      - lint
      - macos
      - msrv
      - package
      - perf
      - pty
      - pty-host
      - schema
      - site
      - test
      - unicode-conformance
      - zig-free
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: prove the gate can fail (seeded violations)
        run: |
          set -euo pipefail

          # A red dependency among green ones.
          seeded='{"a":{"result":"success"},"b":{"result":"failure"}}'
          if printf '%s' "$seeded" | EXPECTED_GATES=2 ./tools/verify-gates.sh >/dev/null 2>&1; then
            echo 'verify accepted a failed dependency — the gate is broken' >&2
            exit 1
          fi

          # A skipped dependency. GitHub reports skipped required checks as
          # success, so "not failure" is not the same question as "success".
          seeded='{"a":{"result":"success"},"b":{"result":"skipped"}}'
          if printf '%s' "$seeded" | EXPECTED_GATES=2 ./tools/verify-gates.sh >/dev/null 2>&1; then
            echo 'verify accepted a skipped dependency — the gate is broken' >&2
            exit 1
          fi

          # No dependencies at all: `all()` over an empty set is true, so a
          # `needs:` list that failed to expand would report green having
          # checked nothing.
          if printf '{}' | EXPECTED_GATES=0 ./tools/verify-gates.sh >/dev/null 2>&1; then
            echo 'verify called an empty dependency set green — the gate is broken' >&2
            exit 1
          fi

          # Positive control: three seeds that can only fail would also pass
          # with the assertion replaced by `exit 1`.
          printf '%s' '{"a":{"result":"success"},"b":{"result":"success"}}' |
            EXPECTED_GATES=2 ./tools/verify-gates.sh >/dev/null
          echo "verify: the assertion rejects red, skipped, and empty, and accepts green"
      - name: every gate green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | ./tools/verify-gates.sh
