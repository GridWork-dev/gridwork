name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked

  # The kernel's ignored integration suite needs a live PostgreSQL superuser:
  # each case creates and initializes its own database plus the runtime role.
  # Keep this separate so service failures do not read as Rust regressions.
  kernel-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWK_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Assert ignored kernel tests exist
        shell: bash
        run: |
          tests="$(cargo test -p gwk-kernel --locked -- --ignored --list)"
          printf '%s\n' "$tests"
          if ! grep -Eq ': test$' <<<"$tests"; then
            echo 'no ignored gwk-kernel tests were discovered' >&2
            exit 1
          fi
      # The performance envelope is ignored as well and REFUSES a debug profile —
      # its numbers are release-mode evidence — so it has its own job below.
      # Named rather than filtered by target: if it is ever renamed this skip
      # stops matching and the debug run fails loudly, which beats a suite that
      # quietly measures nothing.
      - run: cargo test -p gwk-kernel --locked -- --ignored --skip the_phase_performance_envelope_holds
      # The CLI's live case stands a real daemon up on a temp socket and drives
      # the built binary against it. Same service, separate step, so a failure
      # names which half broke.
      - run: cargo test -p gridwork --locked -- --ignored

  # The accepted performance bounds, in release, against the pinned
  # postgres major. The bounds themselves are hardware numbers and the run that
  # asserts them as written is the operator's; a hosted runner is slower and
  # noisier, so this job carries slack and keeps the receipt as the artifact. An
  # order-of-magnitude collapse still reds the build, runner variance does not,
  # and nobody is tempted to repair a flaky gate by loosening what it gates.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWK_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
      GWK_PERF_RECEIPT: gwk-perf-receipt.json
      GWK_PERF_REVISION: ${{ github.sha }}
      GWK_PERF_SLACK: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --release -p gwk-kernel --test perf -- --ignored --nocapture
      # Kept even on failure: a receipt naming which bound collapsed and by how
      # much is the whole point of the job.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: perf-receipt
          path: gwk-perf-receipt.json

  # The second platform the kernel claims. Socket behaviour is not portable by
  # assumption — `sun_path` is 104 bytes here and 108 on Linux, a parent
  # directory's mode is enforced differently, and whether the OS will name a
  # peer's credentials at all is per-kernel — so the UDS rules are run rather
  # than reasoned about.
  #
  # Without PostgreSQL: GitHub's macOS runners cannot run service containers, and
  # brew-installing a server would make the slowest job in this file also the one
  # that breaks on runner-image changes instead of on our code. What runs here is
  # everything that needs no server — the socket cases in `listen.rs`, the frame
  # codec and its properties, the domain and the contract — while the
  # server-backed suites stay on Linux above.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace --all-targets --locked

  # What a crates.io consumer actually receives. `cargo package` verifies by
  # building the packaged LIB, which is why it passed for a year while
  # `gwk-domain`'s own DDL test reached `../../../schema/` — a path that exists
  # in the repo and not in the tarball. So this builds the packaged crate's TEST
  # targets, which is the thing that was broken, and asserts the LICENSE rode
  # along (a root-level file is outside every package root; the per-crate ones
  # are symlinks, and cargo archives them as real files).
  #
  # `gridwork` is absent on purpose: it depends on `gwk-kernel`, which is
  # `publish = false`, so it cannot be packaged at all until the kernel is
  # released. That is a release-ordering fact, not a failure to catch here.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: every published crate builds alone and carries its license and readme
        run: |
          set -euo pipefail
          # `--workspace`, not a per-crate loop. The kernel and the CLI depend on
          # siblings at a version that reaches crates.io only when the release
          # lands, and only this form resolves those against the locally built
          # packages. It also VERIFIES each crate by building it from its own
          # tarball — the one place feature unification is OFF. That is how
          # gwk-kernel 0.0.1 could pass every other job while missing
          # `tokio/macros`: the workspace build handed it the feature that
          # `gridwork` had enabled, and no job ever built the crate on its own.
          cargo package --workspace --locked
          for crate in gwk gwk-domain gwk-cert gwk-theme gwk-kernel gridwork; do
            version=$(cargo metadata --format-version 1 --no-deps \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            # Listed to a file, not piped into `grep -q`: grep would exit on the
            # match, tar would take SIGPIPE, and `pipefail` would read that as a
            # failed package.
            tar tzf "target/package/$crate-$version.crate" > /tmp/crate-files
            grep -qx "$crate-$version/LICENSE" /tmp/crate-files
            grep -qx "$crate-$version/README.md" /tmp/crate-files
          done
          # The contract crates build their TESTS from the tarball too. The
          # kernel and the CLI cannot until their siblings are on crates.io at
          # this version — for those two, the verify build above is the check.
          for crate in gwk gwk-domain gwk-cert gwk-theme; do
            version=$(cargo metadata --format-version 1 --no-deps \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            ( cd "target/package/$crate-$version" && cargo build --tests --locked )
          done

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --workspace --all-targets --locked

  # The DDL is contract: it must apply clean against the pinned postgres major.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Digest-pinned like every action above; dependabot / a manual bump tracks
        # the postgres:16 tag.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: psql "postgresql://postgres:ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f schema/0001_contract.sql
      # Row-level DELETE guards never fire on TRUNCATE; the state tables need a
      # statement-level BEFORE TRUNCATE cover to stay append-only. This single
      # psql -c MUST fail — a passing TRUNCATE means the guard on gwk.command regressed.
      - name: TRUNCATE on the command state table must error
        run: |
          if psql "postgresql://postgres:ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c 'TRUNCATE gwk.command;'; then
            echo 'TRUNCATE gwk.command succeeded — the state-table truncate guard is missing' >&2
            exit 1
          fi
      # A lease fence, once set, must never be cleared or lowered — a
      # 100 -> NULL -> 50 launder would otherwise rewind it past the "< OLD"
      # check and re-arm a deposed writer. Seed a fence, then the clear MUST
      # fail; a passing clear means the fence no-clear/monotonic guard regressed.
      - name: Clearing a set lease fence must error
        run: |
          PGURL="postgresql://postgres:ci@localhost:5432/postgres"
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "INSERT INTO gwk.lease (id, version, fence_token) VALUES ('ci-fence', 1, 100);"
          if psql "$PGURL" -v ON_ERROR_STOP=1 -c "UPDATE gwk.lease SET version=2, fence_token=NULL WHERE id='ci-fence';"; then
            echo 'clearing a set lease fence_token succeeded — the fence no-clear/monotonic guard regressed' >&2
            exit 1
          fi

  # The generated TypeScript contract, goldens, and theme must match the Rust
  # source exactly (xtask --check), decode at runtime under bun, typecheck
  # under exactOptionalPropertyTypes, and stay in sync with the site tokens.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: cargo run --locked -p xtask -- contract --check
      - run: bun install --frozen-lockfile
        working-directory: contracts
      - run: bun test
        working-directory: contracts
      # bun test re-emits goldens-ts/; any difference from the committed
      # files means the TS decode path changed what it read.
      - run: git diff --exit-code contracts/goldens-ts
      - run: bun x tsc --noEmit
        working-directory: contracts
      - run: ./tools/check-theme-sync.sh

  # The site container must stay buildable: repo-root context (allowlist
  # .dockerignore), digest-pinned base, Caddyfile validated at build time.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -f site/Dockerfile .

  # bans/licenses/sources block merges; advisories run separately below so a
  # newly published advisory can't redden an unchanged PR.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses sources

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  # Hosted CI enforces the GENERIC pattern set only — the estate-specific extension
  # (tools/leak-scan.local) is untracked by design and exists solely on operator
  # machines as a local pre-commit/pre-push control. Seeds below therefore trip the
  # generic patterns, and are split so this file never contains a matching literal.
  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: ./tools/leak-scan.sh
      - run: ./tools/check-claims.sh
      - name: prove the gate can fail (seeded violation)
        run: |
          seed=$(printf 'creds at /ho%s/example/data' 'me')
          if echo "$seed" | ./tools/leak-scan.sh --stdin; then
            echo 'leak-scan accepted a seeded violation — the gate is broken' >&2
            exit 1
          fi

  # Commit messages and every line added or deleted inside the PR range publish
  # too — the final tracked tree is not the whole exposure. Same seeded proof.
  # Direct pushes to main (including the very first publication push, which
  # carries the entire history) get their pushed range scanned as well.
  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Range scans (pushed BEFORE..AFTER content, PR message + patch) must never be
    # skipped. A per-SHA group with cancel-in-progress:false keeps back-to-back
    # pushes from superseding each other's scan, so no pushed range goes unscanned.
    # (The workflow-level concurrency still governs the run; this job opts its own
    # group out of cancellation.)
    concurrency:
      group: commit-messages-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: scan PR commit messages
        if: github.event_name == 'pull_request'
        # explicit bash = -o pipefail, so a git-log failure fails the gate
        # instead of feeding the scan empty stdin (fail-open otherwise).
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git log --format=%B "origin/${BASE_REF}..HEAD" | ./tools/leak-scan.sh --stdin
      - name: scan PR diff range (added and deleted lines)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --unified=0 "origin/${BASE_REF}...HEAD" | ./tools/leak-scan.sh --stdin
      - name: scan PR commit content (every commit patch, intermediate included)
        if: github.event_name == 'pull_request'
        # The range diff nets an add-then-remove to zero; scanning each commit's
        # patch catches a value that lived only in an intermediate PR commit.
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git log -p --diff-merges=first-parent "origin/${BASE_REF}..HEAD" | ./tools/leak-scan.sh --stdin
      - name: scan pushed commit messages and content
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            # Branch creation / first publication: there is no before SHA, so the
            # pushed range is the full history of the pushed SHA — messages AND content.
            git log --format=%B "$AFTER" | ./tools/leak-scan.sh --stdin
            git log -p --diff-merges=first-parent "$AFTER" | ./tools/leak-scan.sh --stdin
          else
            git log --format=%B "${BEFORE}..${AFTER}" | ./tools/leak-scan.sh --stdin
            git log -p --diff-merges=first-parent "${BEFORE}..${AFTER}" | ./tools/leak-scan.sh --stdin
          fi
      - name: prove the gate can fail (seeded violation)
        run: |
          seed=$(printf 'see claude.ai/code/ses%s_EXAMPLE' 'sion')
          if echo "$seed" | ./tools/leak-scan.sh --stdin; then
            echo 'commit-message scan accepted a seeded violation — the gate is broken' >&2
            exit 1
          fi
      - name: prove an intermediate-commit leak trips the content scan (seeded)
        shell: bash
        run: |
          # A value added then removed nets to zero in the tree AND the range diff,
          # but the content scan reads every commit's patch. Build a scratch repo
          # whose leak lives only in the MIDDLE commit; the literal is split so this
          # file never contains a matching string.
          tmp=$(mktemp -d)
          git -C "$tmp" init -q
          git -C "$tmp" config user.email ci@example.com
          git -C "$tmp" config user.name ci
          seed=$(printf '/ho%s/example/data' 'me')
          printf 'clean\n'      > "$tmp/f"; git -C "$tmp" add f; git -C "$tmp" commit -qm base
          printf '%s\n' "$seed" > "$tmp/f"; git -C "$tmp" add f; git -C "$tmp" commit -qm intermediate
          printf 'clean\n'      > "$tmp/f"; git -C "$tmp" add f; git -C "$tmp" commit -qm cleanup
          if git -C "$tmp" log -p --diff-merges=first-parent | ./tools/leak-scan.sh --stdin; then
            echo 'content scan missed an intermediate-commit leak — the gate is broken' >&2
            exit 1
          fi
