# T28 reference: image publication (doc 07 §3 + §4).
#
# COPY THIS FILE VERBATIM into each app repo as `.github/workflows/publish-image.yml`.
# Everything repo-specific is a variable or lives in `deploy/services.json`, so the four
# copies stay byte-identical and drift is detectable by comparing hashes. If you find
# yourself editing the body for one repo, that is a bug in this template — fix it here.
#
# What it is NOT: a deployer. Publishing and deploying are separate identities (doc 07
# §2) and separate workflows on purpose. This job may write to Artifact Registry and
# nothing else; it holds no Cloud Run permission at all.

name: publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Single service key to publish; default is every service this repo owns"
        required: false
        type: string
  workflow_call:
    inputs:
      service:
        required: false
        type: string
    outputs:
      digests:
        description: JSON object mapping service key to the published image digest
        value: ${{ jobs.collect.outputs.digests }}

# doc 07 §1: never two publishes of the same ref at once — the second would race the
# first's provenance attestation onto a digest it did not build.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Which services does this push actually change? `watched_paths` in the canonical
  # manifest answers exactly that question (doc 07 §4), so it is the matrix source —
  # never a hand-maintained list that drifts from the manifest the review approved.
  select:
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      # An unset REPOSITORY VARIABLE interpolates to the empty string. It does not fail, and
      # GitHub — not this template — owns what "empty" then means, so an absent variable is a
      # value chosen by someone who is not in the room.
      #
      # `BUN_VERSION_FILE` is the one that proves this is not hygiene. Read at the pinned
      # setup-bun SHA (`0c5077e5`, `action.yml`: neither `bun-version` nor `bun-version-file`
      # is required, the latter defaults to null; `src/action.ts:158`: "If no version
      # specified, default is 'latest'"). So an empty value does not error — it installs the
      # newest Bun, the repo's pin silently stops binding, and the run is green. Same shape
      # as the missing dependency install: a success nobody had to produce.
      #
      # Asserted for every variable the job reads rather than only the ones argued to be
      # dangerous, because deciding which ones self-report is exactly the reasoning that
      # produced the gap. Each job lists its own; a job that stops reading one drops it here
      # in the same edit.
      #
      # First step in the job — before checkout, before `setup-bun`, before any credential.
      # A misconfigured repo costs one red run and nothing else.
      - name: assert the repository variables are set
        env:
          BUN_VERSION_FILE: ${{ vars.BUN_VERSION_FILE }}
        run: |
          set -euo pipefail
          missing=""
          for v in BUN_VERSION_FILE; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::unset repository variables:$missing"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ vars.BUN_VERSION_FILE }}

      # Every `bun run deploy/*.ts` in this pipeline resolves this repo's dependencies, and
      # until 2026-08-21 nothing installed them. Bun's auto-install covered that silently:
      # it fetches from the registry against package.json RANGES, not `bun.lock`, which
      # made the deploy path the only place in these repos where the lockfile did not bind.
      # Every other workflow in all four repos runs `bun install --frozen-lockfile`; the
      # T28 template was the exception, and that was an oversight, not a decision.
      #
      # gridwork is the one repo with nothing to install: it has no root `package.json`
      # (its Bun project is `site/`) and its `deploy/*.ts` are deliberately
      # dependency-free. The `exit 1` arm is what keeps that exemption honest — a repo that
      # grows a package import without a root lockfile fails here instead of quietly
      # auto-installing. `node:` and `bun:` specifiers are builtins, installed from nowhere.
      #
      # This step is byte-identical in all four workflows. Copy it, do not adapt it.
      - name: install the deploy scripts' dependencies
        run: |
          set -euo pipefail
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          elif grep -hoE 'from "[^"]+"' deploy/*.ts | grep -qvE 'from "(\.|node:|bun:)'; then
            echo "::error::deploy/*.ts imports a package but this repo has no root bun.lock"
            exit 1
          fi

      - id: pick
        env:
          ONLY: ${{ inputs.service }}
          BEFORE: ${{ github.event.before }}
        run: bun run deploy/select-services.ts >> "$GITHUB_OUTPUT"

  publish:
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: read
      # doc 07 §1 rule 3: OIDC/WIF only, never a JSON key. The same token is what cosign
      # trades for its signing certificate below — one grant, two consumers, no key anywhere.
      # `attestations: write` is gone with the attestation API (see "sign the digest").
      id-token: write
    steps:
      # doc 07 §3: a fork PR gets nothing. This workflow is push/dispatch-only so a fork
      # cannot reach it, but say so out loud rather than relying on the trigger list
      # staying that way — the failure mode of a widened trigger is silent credential
      # exposure, and this check costs one step.
      - name: refuse a fork ref
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo "::error::fork refs never publish images (doc 07 §3)"
          exit 1

      # See the `select` job for why an unset repository variable is a vendor-chosen value
      # rather than a failure. This job reads five; it asserts all five.
      - name: assert the repository variables are set
        env:
          BUN_VERSION_FILE: ${{ vars.BUN_VERSION_FILE }}
          GCP_IMAGE_PUBLISHER_SA: ${{ vars.GCP_IMAGE_PUBLISHER_SA }}
          GCP_REGISTRY: ${{ vars.GCP_REGISTRY }}
          GCP_REGISTRY_HOST: ${{ vars.GCP_REGISTRY_HOST }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          NODE_VERSION_FILE: ${{ vars.NODE_VERSION_FILE }}
        run: |
          set -euo pipefail
          missing=""
          for v in BUN_VERSION_FILE GCP_IMAGE_PUBLISHER_SA GCP_REGISTRY GCP_REGISTRY_HOST GCP_WIF_PROVIDER NODE_VERSION_FILE; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::unset repository variables:$missing"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ vars.BUN_VERSION_FILE }}

      # CAISSON-209 (2026-08-25, caisson run 32904702863): `deploy/gates.sh` shells Node
      # tools — dependency-cruiser's floor is ^22||^24||>=26 — and a Bun-only job runs
      # Node SHIMS on whatever Node the runner image ships (20.20.0 that day). With no
      # pin there was nothing to drift and nothing to report until a tool raised its
      # floor. Same discipline as BUN_VERSION_FILE: the version lives in a repo-owned pin
      # file named by a repository variable asserted above — never a literal here that
      # drifts per repo — and an EMPTY file input falls back to the same system Node this
      # exists to escape, which is why the variable is in the assertion.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ vars.NODE_VERSION_FILE }}

      # Same step as the `select` job above — see there for why it is not an unconditional
      # `bun install` and what the `exit 1` arm catches. The bodies must not drift.
      - name: install the deploy scripts' dependencies
        run: |
          set -euo pipefail
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          elif grep -hoE 'from "[^"]+"' deploy/*.ts | grep -qvE 'from "(\.|node:|bun:)'; then
            echo "::error::deploy/*.ts imports a package but this repo has no root bun.lock"
            exit 1
          fi

      - name: resolve build inputs
        id: svc
        env:
          SERVICE: ${{ matrix.service }}
        run: bun run deploy/service-inputs.ts >> "$GITHUB_OUTPUT"

      # doc 07 §3: lint, typecheck, tests, and an image that builds — before anything is
      # pushed anywhere. A digest that was never tested is worse than no digest, because
      # the rollback ladder will happily promote it.
      #
      # The commands live in the repo's own `deploy/gates.sh`, not here. They were literal
      # `bun run lint/typecheck/test` until the gridwork adoption proved that wrong: that
      # repo has no root package.json, pins Bun at site/package.json, and runs its lint
      # through ./tools/lint.sh. Four repos do not share a script vocabulary, and a
      # template that assumes they do forces exactly the per-repo body edit this design
      # exists to prevent. `gates.sh` must exit non-zero when any gate fails.
      - name: gates
        run: bash deploy/gates.sh

      # Anything that must happen on the HOST before Docker is handed the build
      # context. dev-profile is why this exists: its Dockerfile builds a staged
      # public-only tree (tools/build-site-target.ts -> .site-build-public/) behind a
      # .dockerignore allowlist, so the staging step cannot move inside the Dockerfile —
      # by the time Docker runs, the context has already been filtered.
      #
      # REQUIRED in every repo, not skip-if-absent. A repo with nothing to prepare ships
      # a one-line script saying so. An `if [ -f ... ]` guard here would make "no
      # preparation needed" and "the script is missing" identical at a glance, and the
      # failure mode of the second is an image built from the wrong tree that passes
      # every gate above it.
      - name: prepare build context
        run: bash deploy/prepare-build.sh

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISHER_SA }}
          token_format: access_token
          # doc 07 §4: the generated credential file must never reach a Docker context.
          # `create_credentials_file: false` is the mechanical guarantee; .dockerignore
          # entries are the belt, this is the braces.
          create_credentials_file: false

      # `GCP_REGISTRY_HOST` is the host `docker login` sends the access token to, and
      # `GCP_REGISTRY` is the host the image is actually pushed to. They are two
      # independent repository variables that only happen to agree, and nothing checked
      # that they did — so a principal who can write repository variables but cannot read
      # secrets (a `repo`-scoped PAT, an org owner setting an org-level var) could point
      # the login at a host they control and receive a live GCP access token for the
      # image-publisher SA. The push to GCP_REGISTRY then fails and the run goes red,
      # after the credential has already left. `create_credentials_file: false` does not
      # help: it stops the credential reaching a Docker CONTEXT, not a login to the wrong
      # host.
      #
      # Asserted rather than derived because `docker login` takes a host, not a
      # host-plus-path, so GCP_REGISTRY cannot simply be passed through. The pair check is
      # the property that matters: the token only ever goes to the host the image goes to.
      - name: assert the login host is the registry's own host
        env:
          REGISTRY: ${{ vars.GCP_REGISTRY }}
          REGISTRY_HOST: ${{ vars.GCP_REGISTRY_HOST }}
        run: |
          set -euo pipefail
          case "$REGISTRY_HOST" in
            *.pkg.dev) ;;
            *) echo "::error::GCP_REGISTRY_HOST is not an Artifact Registry host"; exit 1 ;;
          esac
          case "$REGISTRY" in
            "$REGISTRY_HOST"/*) ;;
            *) echo "::error::GCP_REGISTRY_HOST is not the host of GCP_REGISTRY — refusing to send a registry credential to it"; exit 1 ;;
          esac

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # CORE-73: a workflow_dispatch re-run of an already-published sha used to go RED at
      # push time — the rebuild is not byte-reproducible, so the same :sha tag arrives
      # with a new manifest and Artifact Registry's tag immutability refuses it. A red
      # that reads as a regression while saying only "this was already published". The
      # registry's existing digest IS the truth for that sha, so a re-run re-emits it and
      # skips the build instead of failing. It is the truth about WHAT the bytes are —
      # not about whether they were signed or scanned: the run that pushed may have died
      # between the push and either claim, so the evidence chain below keys on the
      # resolved digest (see `resolve digest`) and re-earns both on every run.
      #
      # Three outcomes, fail-closed: the tag resolves -> published=true plus its digest;
      # the registry says the tag/repo does not exist -> published=false, build proceeds;
      # anything else (auth, network, parse) -> red. "Cannot tell" must never build —
      # guessing "not published" here would recreate the immutability red this exists to
      # remove, one step later and with less context. `imagetools inspect` reads through
      # the docker login above and returns the same index digest buildx emitted when it
      # pushed, which is what every deploy and rollback consumes.
      - name: already published at this sha?
        id: preflight
        env:
          IMAGE: ${{ vars.GCP_REGISTRY }}/${{ matrix.service }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if out="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' 2>preflight-err.txt)"; then
            digest="$(printf '%s' "$out" | jq -r '.digest // empty')"
            case "$digest" in
              sha256:?*) ;;
              *) echo "::error::registry answered for ${IMAGE}:${TAG} but returned no parseable digest"; exit 1 ;;
            esac
            printf 'published=true\ndigest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
            echo "::notice title=already published (CORE-73)::${IMAGE}:${TAG}@${digest} — build skipped, digest re-emitted"
          elif grep -qiE 'not found|NAME_UNKNOWN|MANIFEST_UNKNOWN' preflight-err.txt; then
            printf 'published=false\n' >> "$GITHUB_OUTPUT"
          else
            echo "::error::cannot determine whether ${IMAGE}:${TAG} is already published — refusing to guess"
            cat preflight-err.txt >&2
            exit 1
          fi

      # No `latest`. Doc 07 §4: human-readable tags may carry the full SHA, but nothing
      # in a deploy or a rollback ever resolves a tag — they consume the digest this step
      # emits. A floating tag in a rollback path is how you roll back to the thing you
      # were trying to escape.
      #
      # Skipped when preflight found the tag (CORE-73). The evidence chain below does NOT
      # skip with it: sign, SBOM, scan, manifest, and the evidence upload key on the
      # resolved digest, not on this step — evidence follows the digest, whichever run
      # pushed it (see `resolve digest`).
      - name: build and push by digest
        id: build
        if: steps.preflight.outputs.published != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.svc.outputs.build_context }}
          file: ${{ steps.svc.outputs.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ vars.GCP_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # One digest, one fact. `steps.build.outcome == 'success'` used to key all five
      # attestation steps below (sign, SBOM, scan, manifest, evidence upload) — a proxy
      # for three different facts (a digest exists / it is signed / it is scanned) that
      # went wrong on the CORE-73 skip path: a skipped build's outcome is 'skipped', so
      # all five guards skipped with it, `record digest` re-emitted the preflight digest
      # ungated, and the re-run went green carrying an unearned "already signed, already
      # scanned" claim. Two live shapes of that hole: a TRIVY_EXIT_CODE=1 repo whose run
      # 1 pushed, signed, then went red on a CRITICAL — "Re-run failed jobs" published
      # the blocked digest green, with production's cosign verify passing because run 1
      # genuinely signed; and a sign that died after the push, whose digest no later run
      # could ever sign — every re-run entered the skip path and skipped sign with it.
      #
      # This step resolves THE digest — the build's, or the one preflight read back —
      # and everything below keys on its existence: `always() && steps.image.outputs.digest != ''`.
      # A skipped step's outputs are empty strings, so a failed build still skips the
      # chain and a red preflight still reds the job: fail-closed unchanged. On the skip
      # path the run re-EARNS the claims instead of inheriting them: cosign sign is
      # idempotent (one more Rekor entry, same verification), the SBOM and the scan read
      # the digest from the registry by ref — no rebuild — and a repo that set
      # TRIVY_EXIT_CODE=1 keeps its gate: a re-run of a scan-blocked publish re-scans
      # and goes red again. The deliberate cost: with TRIVY_EXIT_CODE=1, a re-dispatch
      # of an old green sha can go red on a CVE published since — that is the repo's own
      # policy speaking, not a liveness failure; the unset-default ('0') re-dispatch
      # stays green and keeps the liveness-probe property.
      - name: resolve digest
        id: image
        env:
          # Whichever path ran: the build's digest, or the one preflight read back from
          # the registry (CORE-73). Exactly one is ever non-empty.
          DIGEST: ${{ steps.build.outputs.digest || steps.preflight.outputs.digest }}
        run: |
          set -euo pipefail
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      # doc 07 §4 asks for provenance on the published digest. This was
      # `actions/attest-build-provenance`, and on three of the four repos it failed AFTER
      # the push: the GitHub attestations API is plan-gated for private repositories, so
      # the step went red with the digest already in the registry, `collect` was skipped,
      # and `digests` never published — a good build made unshippable by a billing tier.
      # Operator ruling R44 (2026-08-25): sign with Sigstore directly, no GitHub API in
      # the path.
      #
      # Keyless. cosign trades this job's OIDC token for a short-lived Fulcio certificate
      # whose subject IS this workflow file at this ref, signs the digest, and records the
      # signature in the public Rekor log. There is no key to hold, rotate, or leak, and
      # the verifier — deploy-production.yml, the one place these digests become
      # production revisions — checks an identity STRING, not a key it has to fetch: a
      # digest that this workflow at refs/heads/main did not sign is refused there before
      # any revision exists. A key-based alternative (a KMS key) would trade that for new
      # infra, IAM on two identities, and a verifier that must hold a credential.
      #
      # Residual, stated rather than implied: the Rekor entry is public and names this
      # repository, this workflow path, the commit, and the image reference (registry
      # host, GCP project, service). Nothing secret — but a private repo's name and its
      # registry path become discoverable. Accepted by the ruling.
      #
      # Signed by DIGEST: a tag is a pointer, and signing the pointer proves nothing about
      # what it points at today. `--yes` is the non-interactive consent to the Rekor
      # upload. The pinned `cosign-release` must match deploy-production.yml's — the two
      # are one number in two files, and the template test holds them equal.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: sign the digest (keyless)
        if: always() && steps.image.outputs.digest != ''
        env:
          IMAGE: ${{ vars.GCP_REGISTRY }}/${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # Guarded like the manifest below (see there): once the digest exists, the SBOM and
      # the scan run whatever failed between the build and here. Under the default
      # `success()` a failed sign skipped both, so the run ended with a live digest and a
      # CVE list it could not show — studio's report measured exactly that shape.
      - name: sbom
        if: always() && steps.image.outputs.digest != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ vars.GCP_REGISTRY }}/${{ matrix.service }}@${{ steps.image.outputs.digest }}
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: vulnerability scan
        if: always() && steps.image.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.GCP_REGISTRY }}/${{ matrix.service }}@${{ steps.image.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          # Report by default, gate by repo policy (CORE-74) — a template that blocks
          # every publish on a base-image CVE with no fix available gets disabled within
          # a week, and a disabled scan is worth less than a recorded one. So the dial is
          # a repository variable, never a workflow edit: unset resolves to '0' (record
          # in SARIF, never block); a repo that wants CRITICAL,HIGH findings to fail the
          # publish sets TRIVY_EXIT_CODE=1. Deliberately absent from the assert loop —
          # unset is the documented default, not a misconfiguration.
          exit-code: ${{ vars.TRIVY_EXIT_CODE || '0' }}
          severity: CRITICAL,HIGH

      # doc 07 §11: the evidence IS the deliverable. A deploy that cannot show its
      # digest, its tests and its scan is not a deploy you can reason about at 3am.
      #
      # Every value arrives through `env:` and is read as "$VAR" — including the output
      # FILENAME. This was nine ${{ }} interpolations inside a `cat <<JSON` heredoc, the
      # same defect class as the confirmed deploy-staging exploit: the runner substitutes
      # ${{ }} into the script TEXT before a shell parses it, so a value containing $(...)
      # arrived as executable source, after auth, with a live registry credential in
      # reach. Quoting the delimiter is not the fix — a value carrying a quote still
      # breaks out of the surrounding quoting, and one carrying the delimiter line still
      # ends the heredoc early. env: is the fix: the value goes to the process
      # environment, never into the script text.
      #
      # "Those inputs are hard to reach" is not a security property — `dockerfile` and
      # `build_context` come from deploy/service-inputs.ts reading deploy/services.json,
      # generated from a manifest a human edits. `jq -n --arg` builds the body for the
      # same reason: a quote or backslash yields valid JSON, not a file collect cannot
      # parse. No -c, deliberately — this file is read by a human, and the -c rule binds
      # values captured into a variable or written to $GITHUB_OUTPUT.
      #
      # `if: always() && steps.image.outputs.digest != ''`, on the sign, SBOM, and scan
      # above, here, and on the evidence upload below (2026-08-25, measured on studio run
      # 32904680804 and dev-profile's red main; re-keyed 2026-08-26, see `resolve
      # digest`): once a digest EXISTS in the registry — this run's build, or a prior
      # run's read back by the preflight — the evidence runs, whatever fails around it.
      # Under the default `success()` a failed attest, scan, or SBOM skipped them and
      # the run ended with a live digest and no manifest, no SBOM, no SARIF — a CVE the
      # run could not name, and a digest that had to be re-scanned by hand. Keyed to the
      # DIGEST, not to any one predecessor: keying it to the scan is right for a repo
      # whose scan fails and wrong for one whose attest fails, and keying it to the
      # build was wrong for the run whose build correctly SKIPPED. `collect` is still
      # gated on the whole job succeeding, so nothing downstream consumes a digest from
      # a failed publish; this only keeps the evidence of what was pushed.
      - name: source-to-image manifest
        if: always() && steps.image.outputs.digest != ''
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          IMAGE: ${{ vars.GCP_REGISTRY }}/${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
          DOCKERFILE: ${{ steps.svc.outputs.dockerfile }}
          BUILD_CONTEXT: ${{ steps.svc.outputs.build_context }}
        run: |
          set -euo pipefail
          jq -n \
            --arg service "$SERVICE" \
            --arg repository "$REPOSITORY" \
            --arg commit "$COMMIT" \
            --arg ref "$REF" \
            --arg run_id "$RUN_ID" \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg dockerfile "$DOCKERFILE" \
            --arg build_context "$BUILD_CONTEXT" \
            '{service: $service, repository: $repository, commit: $commit, ref: $ref, run_id: $run_id, image: $image, digest: $digest, dockerfile: $dockerfile, build_context: $build_context}' \
            > "image-manifest-$SERVICE.json"

      # Same guard as the manifest step. The manifest is the anchor: it exists whenever
      # a digest was resolved, so `if-no-files-found: error` still binds — an upload with
      # NOTHING to carry is a bug, an upload missing the SBOM because the SBOM step failed
      # is the evidence of that failure. A `hashFiles` guard would be wrong here: it goes
      # quiet on the day the manifest step itself breaks.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.image.outputs.digest != ''
        with:
          name: publish-evidence-${{ matrix.service }}
          path: |
            image-manifest-${{ matrix.service }}.json
            sbom-${{ matrix.service }}.spdx.json
            trivy-${{ matrix.service }}.sarif
          if-no-files-found: error
          overwrite: true

      # Both values through env:. This was `echo '${{ ... }}' > "digests/${{ ... }}"` —
      # single quotes are not a sandbox, they are text the runner writes around text it
      # already substituted, so one quote character in either value ends the quoting and
      # the rest of the value is shell. `printf '%s\n'` also beats `echo` here: echo
      # interprets leading dashes and backslashes on some shells, printf does not.
      - name: record digest
        env:
          SERVICE: ${{ matrix.service }}
          # The one resolved digest — same value every attestation step above signed,
          # SBOM'd, and scanned. Under the default `success()` this step is unreachable
          # when any of them failed, so a recorded digest is one whose attestation ran
          # and passed ON THIS RUN; the empty-digest refusal below is the belt for the
          # pathological build-emitted-nothing path.
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "::error::no digest from the build or the preflight — nothing to record"
            exit 1
          fi
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$SERVICE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}
          if-no-files-found: error
          overwrite: true

  collect:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      digests: ${{ steps.collect.outputs.digests }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: false
      # `jq -c` is load-bearing, not a nicety. Without it jq pretty-prints, so the
      # accumulator was MULTILINE from the first service onward and then written with
      # `printf 'digests=%s\n'` into $GITHUB_OUTPUT — a single-line key=value format.
      # This was broken, not merely risky: the `digests` workflow_call output was corrupt
      # for every non-empty publish, and it is the exact input deploy-staging and
      # deploy-production consume. -c keeps the object on one line so the write is valid.
      - id: collect
        run: |
          set -euo pipefail
          # nullglob so an empty download expands to nothing rather than to the literal
          # pattern. Without it the loop runs once on `digests/digest-*/*`, `cat` fails
          # inside a --arg command substitution whose outer jq still exits 0, and the
          # output becomes `digests={"*":""}` — a green publish handing the deploy
          # workflows a service named `*`. Unreachable today (collect is gated on
          # publish success and both uploads use if-no-files-found: error), which is
          # exactly why it would not be noticed the day one of those changes.
          shopt -s nullglob
          json='{}'
          for d in digests/digest-*/*; do
            svc="$(basename "$d")"
            json="$(printf '%s' "$json" | jq -c --arg k "$svc" --arg v "$(cat "$d")" '. + {($k): $v}')"
          done
          printf 'digests=%s\n' "$json" >> "$GITHUB_OUTPUT"
