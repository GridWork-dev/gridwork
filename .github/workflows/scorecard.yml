name: scorecard

# OpenSSF Scorecard for the default branch, published to the Scorecard API and uploaded to
# code scanning. branch_protection_rule keeps the Branch-Protection check current; the
# weekly schedule keeps Maintained current. Not a merge gate.

on:
  branch_protection_rule:
  schedule:
    - cron: '17 6 * * 2'
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Every trigger above runs on the default branch, which publish_results requires.
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results signs its upload with OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
