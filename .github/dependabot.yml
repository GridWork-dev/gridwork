# Dependency bump PRs. Monthly, because this repo pins deliberately and a weekly
# stream of bumps against a full CI matrix is noise, not maintenance. (This line
# used to say "thirteen required contexts". There is one — `verify` — and it has
# been one for as long as branch protection has existed here.)
#
# Every pin here is a SHA or an exact version — actions by commit, crates by
# `=x.y.z`. Pinning without a bump path is how a repo ends up two years stale on
# an action nobody remembers pinning, so the pins and this file are one decision,
# not two.
#
# A cargo bump of `libghostty-vt` will turn the `pty` job RED rather than merge:
# its version lives in BOTH Cargo.toml and crates/gwk-pty/pins.env, alongside the
# ghostty revision and the Zig version it has to move with, and
# tools/pty-toolchain.sh asserts the two agree. That is the intended outcome — a
# re-pin is a phase decision (R3 budgets one per phase), so the bot is allowed to
# propose it and not allowed to land it quietly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  # The two Bun projects. They had no bump path at all until now: this file
  # covered actions and cargo, so every JavaScript dependency in the repo was
  # pinned with nothing proposing a move. site/ had drifted seven packages
  # behind before anyone looked, and nothing would have said so.
  #
  # Two entries rather than one because there is no root package.json — site/
  # and contracts/ are independent projects with their own lockfiles, and
  # Dependabot resolves a directory, not a workspace that does not exist.
  #
  # `bun`, not `npm`: the npm ecosystem does not understand bun.lock and would
  # leave it stale against a package.json it had just bumped. Requires Bun
  # >= 1.1.39, which both projects clear (site/Dockerfile pins 1.3.14).
  #
  # Know the limit before trusting this: the bun ecosystem does VERSION updates
  # only — GitHub does not issue Dependabot SECURITY updates for it. A published
  # advisory against a JS dependency here will not open a PR by itself. Cargo
  # gets both, which is why the two halves of the repo are not equally covered
  # and it is worth writing down rather than assuming symmetry.
  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  - package-ecosystem: bun
    directory: /contracts
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
