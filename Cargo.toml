[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/GridWork-dev/gridwork"

# Every public dependency is pinned here once. A crate that names its own
# version is a second place for the same number to drift.
[workspace.dependencies]
gwk-cert = { path = "crates/gwk-cert", version = "0.0.1" }
gwk-domain = { path = "crates/gwk-domain", version = "0.0.1" }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-native-roots",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
