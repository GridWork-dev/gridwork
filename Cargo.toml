[workspace]
members = ["crates/*", "xtask"]
# `gwk-pty` is a full member — one lockfile, the shared dependency pins above,
# and `deny`/`advisories` coverage — but it is not a DEFAULT member, because
# building it needs Zig 0.15.2 and a ghostty checkout (crates/gwk-pty/pins.env).
# Without this, every `cargo test --workspace` job would need a 71 MB source tree
# and a ~560 MB Zig package cache to build a crate three of them have no interest
# in. The `pty` CI job runs clippy and tests for it explicitly, so it loses no
# coverage — it just gets its own lane.
#
# Consequence to know before adding a crate: a new `crates/*` entry is a member
# but NOT a default member unless it is listed here.
default-members = [
  "crates/gridwork",
  "crates/gwk",
  "crates/gwk-cert",
  "crates/gwk-domain",
  "crates/gwk-kernel",
  "crates/gwk-theme",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/GridWork-dev/gridwork"

# Every public dependency is pinned here once. A crate that names its own
# version is a second place for the same number to drift.
[workspace.dependencies]
aead = "0.6.1"
aead-stream = "0.6.0"
base64 = "0.23.0"
chacha20poly1305 = "0.11.0"
gwk-cert = { path = "crates/gwk-cert", version = "0.0.2" }
gwk-domain = { path = "crates/gwk-domain", version = "0.0.2" }
gwk-kernel = { path = "crates/gwk-kernel", version = "0.0.2" }
gwk-theme = { path = "crates/gwk-theme", version = "0.0.2" }
# The SAFE wrapper, not the raw `-sys` bindings: this workspace forbids
# `unsafe_code`, so raw FFI would not compile here at all. Exact-pinned because
# libghostty-vt is pre-1.0 and its own docs promise breaking changes — a caret
# range would let a patch release move the C ABI under a green lockfile. Moves
# only together with the two pins in crates/gwk-pty/pins.env.
libghostty-vt = "=0.2.1"
# Generative tests only, for the three invariants where a hand-picked example
# cannot cover the input space: the frame codec, the u64-through-decimal-TEXT
# conversion, and cursor paging. Default features off — `fork` and `timeout`
# want a subprocess per case, which buys nothing for pure functions.
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
# One call: `geteuid`, for the UDS peer check. Chosen over `libc` because its
# wrapper is SAFE — the workspace forbids `unsafe_code`, so a raw extern call
# would not compile here — and over `nix` because it was already in the tree.
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-native-roots",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
