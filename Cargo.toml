[workspace]
members = ["crates/*", "xtask"]
# `gwk-pty` is a full member — one lockfile, the shared dependency pins above,
# and `deny`/`advisories` coverage — but it is not a DEFAULT member, because
# building it needs Zig 0.15.2 and a ghostty checkout (crates/gwk-pty/pins.env).
# Without this, every `cargo test --workspace` job would need a 71 MB source tree
# and a ~560 MB Zig package cache to build a crate three of them have no interest
# in. The `pty` CI job runs clippy and tests for it explicitly, so it loses no
# coverage — it just gets its own lane.
#
# Four more crates are excluded for the same reason one step removed, and until
# now that reason lived only in a ci.yml step comment — which is the wrong place
# for it, because this list is where someone looks to find out why their crate
# is not building. `gwk-adapter-claude`, `gwk-adapter-codex` and
# `gwk-adapter-opencode` each take `gwk-pty.workspace = true`, so they inherit
# the Zig toolchain transitively; `gwk-parity` depends on all three. Adding any
# of them here would drag the 71 MB tree back into every default build, which is
# exactly what excluding `gwk-pty` was for. Each has its own CI lane.
#
# So the excluded set is six: `gwk-pty` (Zig directly), `gwk-pty-host` (policy),
# and those four (Zig transitively).
#
# Consequence to know before adding a crate: a new `crates/*` entry is a member
# but NOT a default member unless it is listed here. `gwk-pty-host` is the
# newest crate absent from this list — no Zig requirement itself yet, kept out
# on the same policy rather than moved in and back out the day it depends on
# `gwk-pty`. Its own `pty-host` CI job covers it explicitly.
default-members = [
  "crates/gridwork",
  "crates/gwk",
  "crates/gwk-cert",
  "crates/gwk-context",
  "crates/gwk-context-compiler",
  "crates/gwk-context-verifier",
  "crates/gwk-domain",
  "crates/gwk-kernel",
  "crates/gwk-text",
  "crates/gwk-theme",
  "crates/gwk-tui",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/GridWork-dev/gridwork"

# Every public dependency is pinned here once. A crate that names its own
# version is a second place for the same number to drift.
[workspace.dependencies]
aead = "0.6.1"
aead-stream = "0.6.0"
# The ACP SDK, for the one adapter that speaks its wire: gwk-adapter-opencode,
# and no other. This said "all three converge on its Agent trait as the internal
# normalization surface", which was the load-bearing version of a claim three
# crate docs and docs/PARITY.md also carried and none of them could support.
# `Agent` is not a trait: it is a zero-sized marker struct implementing the SDK's
# `Role`, tagging one end of a JSON-RPC connection. The normalization surface is
# gwk's own, `gwk_domain::engine::EngineAdapter`. The WIRE version pin (v1) lives
# in adapter code as the negotiated protocol version, not here — the crate serves
# several wire versions from one release.
agent-client-protocol = "2.0.0"
base64 = "0.23.0"
chacha20poly1305 = "0.11.0"
# Already in the graph transitively (ratatui's default backend); named here for
# ONE reason: the `osc52` feature, which is how the console copies an ID to the
# clipboard through the library instead of hand-writing the escape — the P12
# exemption covers crossterm-MEDIATED I/O, and a hand-emitted OSC sequence is
# not that. Feature unification turns it on for the same 0.29 copy ratatui
# already links; its `base64` 0.22 requirement is likewise already resolved.
crossterm = { version = "0.29.0", features = ["osc52"] }
# Path-only, no version, like `gwk-pty` below: unpublished (`publish = false`)
# — building any of the three needs Zig and a pinned ghostty checkout through
# their shared `gwk-pty` dependency, and none is meaningful without a
# logged-in engine CLI besides.
gwk-adapter-claude = { path = "crates/gwk-adapter-claude" }
gwk-adapter-codex = { path = "crates/gwk-adapter-codex" }
gwk-adapter-opencode = { path = "crates/gwk-adapter-opencode" }
gwk-cert = { path = "crates/gwk-cert", version = "0.0.3" }
# Path-only for the same reason as `gwk-pty` below, reached by a different
# route: `gwk-context` is `publish = false` until E3 lands the wire-v2 grammar.
# A `version` here is not documentation — it makes `cargo package` resolve the
# dependency from the crates.io index, where an unpublished crate is not, so
# `xtask` failed to package over a crate that was never going to be there.
gwk-context = { path = "crates/gwk-context" }
gwk-domain = { path = "crates/gwk-domain", version = "0.0.3" }
gwk-kernel = { path = "crates/gwk-kernel", version = "0.0.3" }
# Path-only, no version: unpublished (`publish = false`), like the adapter
# crates that depend on it.
gwk-pty = { path = "crates/gwk-pty" }
gwk-text = { path = "crates/gwk-text" }
gwk-theme = { path = "crates/gwk-theme", version = "0.0.3" }
# The installed `gw` binary carries the production terminal loop.
gwk-tui = { path = "crates/gwk-tui", version = "0.0.3" }
# The SAFE wrapper, not the raw `-sys` bindings: this workspace forbids
# `unsafe_code`, so raw FFI would not compile here at all. Exact-pinned because
# libghostty-vt is pre-1.0 and its own docs promise breaking changes — a caret
# range would let a patch release move the C ABI under a green lockfile. Moves
# only together with the two pins in crates/gwk-pty/pins.env.
libghostty-vt = "=0.2.1"
hmac = "0.13.0"
# PTY allocation and child spawn. Chosen over `portable-pty` because it needs
# exactly two dependencies, `rustix` and `tokio`, and this workspace already
# pins both — where `portable-pty` brings fifteen, including a second `nix` and
# a `bitflags` one major behind ours. It also has to be a dependency rather
# than our own code: allocating a PTY and putting the child in its own session
# means `pre_exec` and `setsid`, and `unsafe_code` is FORBIDDEN in this
# workspace, which is a lint level `#[allow]` cannot reach past.
pty-process = { version = "0.5.3", default-features = false, features = ["async"] }
# Generative tests only, for the three invariants where a hand-picked example
# cannot cover the input space: the frame codec, the u64-through-decimal-TEXT
# conversion, and cursor paging. Default features off — `fork` and `timeout`
# want a subprocess per case, which buys nothing for pure functions.
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
# The console's rendering library. 0.30 split the project into `ratatui-core`
# (types) and the crates that build on it, which is why CI asserts the lockfile
# carries exactly ONE `ratatui-core`: every widget and effect crate in the
# ecosystem re-exports its `Buffer`, and two `ratatui-core` versions in the
# graph are two incompatible `Buffer` types that will not compile together. The
# assertion exists now, before a second such crate is in the tree, so the bump
# that brings one arrives at a check rather than at a type error nobody expected.
# `underline-color` carries a hosted session's SGR 58 value through the
# drill-down buffer; without it the typed wire field would disappear at paint.
ratatui = { version = "0.30.2", features = ["underline-color"] }
# Every Hall motion verb runs through this one effects engine. Exact-pinned to
# the ratatui-core-compatible release measured by the motion spike; std-duration
# lets the frame consume the console's existing std::time::Duration cadence.
tachyonfx = { version = "=0.25.1", features = ["std-duration"] }
# One call: `geteuid`, for the UDS peer check. Chosen over `libc` because its
# wrapper is SAFE — the workspace forbids `unsafe_code`, so a raw extern call
# would not compile here — and over `nix` because it was already in the tree.
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-native-roots",
] }
thiserror = "2.0.19"
tempfile = "3.27.0"
tokio = { version = "1.53.1", default-features = false }
toml = "0.9"
# Already resolved: `sqlx`/`tokio-util` pull it transitively, so naming it
# here adds no crate to the graph, only a new edge to one cargo-deny already
# cleared — the same reasoning as the two unicode crates below. Named for
# `gwk-pty-host`'s own structured event sink (`tracing::Subscriber`,
# implemented directly against this crate rather than adding
# `tracing-subscriber`, which is NOT already resolved and would be a real new
# dependency for what a bounded event-formatting sink does not need).
tracing = "0.1.44"
# These Unicode tables add no crate to the graph: all were already resolved
# transitively before gwk-text named them. The exact width and segmentation
# pins prevent peer resolution drift; gwk-text's compile-time version gate also
# checks the properties table against the same declared Unicode release.
unicode-properties = "0.1.4"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
# The YAML Organization's maintained fork of the archived `serde_yaml`, and the
# reason the pin is 0.10.4 rather than the newest release is worth stating: the
# newest two landed 2026-08-11 and 2026-08-12, inside the seven-day
# `minimumReleaseAge` this repository's own Renovate policy applies to every
# update. Taking one of them by hand would be routing around a hold that exists
# for exactly the window a fresh publish sits in. Renovate proposes the bump
# through review once it ages out. NOT `serde_yml`: a different fork, and the
# deprecated `serde_yaml` it replaces is archived upstream.
yaml_serde = "=0.10.4"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
