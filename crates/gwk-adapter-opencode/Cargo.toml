[package]
name = "gwk-adapter-opencode"
version = "0.0.2"
description = "opencode engine adapter: ACP wire v1, server event bus, native TUI through gwk-pty"
homepage = "https://gridwork.dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published, same reason as gwk-pty: the dependency on it makes this crate
# need Zig and a pinned ghostty checkout to build, and it is meaningless
# without a logged-in engine CLI besides. The `package` job excludes it by
# name, like gwk-pty.
publish = false

[dependencies]
agent-client-protocol.workspace = true
gwk-domain.workspace = true
gwk-pty.workspace = true
pty-process.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
