[package]
name = "gwk-tui"
version = "0.0.2"
description = "The GridWork terminal console — the thin client that renders kernel projections"
homepage = "https://gridwork.dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published at this commit: the crate has no API and no consumer yet, and an
# empty crate on crates.io advertises a surface that does not exist. It flips
# publishable in the change that first makes `gridwork` depend on it — the
# install carries kernel + CLI + lenses — and the README crates-table row rides
# that same change rather than landing ahead of the thing it describes.
publish = false

[dependencies]
# Direct, not just ratatui's transitive backend: [`input`] needs the `osc52`
# feature for the library-mediated clipboard command, and the typed event and
# terminal-mode types it plumbs are crossterm's own.
crossterm.workspace = true
# The contract. The console consumes kernel state as wire data and emits typed
# commands back — both are gwk-domain's types, and re-declaring them here would
# be a second contract. This is not the PTY engine: the CI tree assertion
# guards `gwk-pty`/`libghostty`, and neither is in gwk-domain's graph.
gwk-domain.workspace = true
# The ratified vocabulary. This crate holds the one function that turns a
# resolved slot into a renderer colour, so it needs the resolution; it does not
# hold the resolution itself, which is data and belongs with the data.
gwk-theme.workspace = true
# In use as of the theme binding above. It was declared one commit ahead of its
# first consumer so the single-`ratatui-core` lockfile assertion in CI had
# something to assert before any widget existed.
ratatui.workspace = true
# Width is presentation data here: right-aligned tails must compare terminal
# cells, not UTF-8 bytes. Already present through ratatui, so this adds one
# direct edge and no crate to the lockfile.
unicode-width.workspace = true

[dev-dependencies]
# The board-live example decodes real kernel pages through the contract's
# `ProjectionRecord` before rendering them — the smoke run's whole point.
serde_json.workspace = true

[lints]
workspace = true
