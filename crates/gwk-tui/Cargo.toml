[package]
name = "gwk-tui"
version = "0.0.3"
description = "The GridWork terminal console — the thin client that renders kernel projections"
homepage = "https://gridwork.sh"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The installed `gw` binary carries this crate as its terminal surface.
publish = true

[dependencies]
# Direct, not just ratatui's transitive backend: [`input`] needs the `osc52`
# feature for the library-mediated clipboard command, and the typed event and
# terminal-mode types it plumbs are crossterm's own.
crossterm.workspace = true
# The contract. The console consumes kernel state as wire data and emits typed
# commands back — both are gwk-domain's types, and re-declaring them here would
# be a second contract. This is not the PTY engine: the CI tree assertion
# guards `gwk-pty`/`libghostty`, and neither is in gwk-domain's graph.
gwk-domain.workspace = true
# The ratified vocabulary. This crate holds the one function that turns a
# resolved slot into a renderer colour, so it needs the resolution; it does not
# hold the resolution itself, which is data and belongs with the data.
gwk-theme.workspace = true
# In use as of the theme binding above. It was declared one commit ahead of its
# first consumer so the single-`ratatui-core` lockfile assertion in CI had
# something to assert before any widget existed.
ratatui.workspace = true
# The operator summaries are one typed value shared by the Board frame and
# its machine-readable CLI twin.
serde.workspace = true
# Linux terminal probing waits on stdin readiness through safe poll bindings;
# silence must degrade instead of blocking raw mode indefinitely.
rustix = { workspace = true, features = ["event"] }
# Opaque kernel IDs are digest-normalized into bounded cell-safe view IDs.
# Already in the workspace graph through the kernel and CLI.
sha2.workspace = true
# Layout stays on Canvas; this edge owns all character and movement effects.
tachyonfx.workspace = true
# Typed failures at the filesystem/process boundary. Callers must be able to
# distinguish an off-allowlist refusal from an editor or git failure.
thiserror.workspace = true
# Atomic same-directory replacement for policy files and isolated editor
# scratch copies. Already present in the lockfile through xtask's tests.
tempfile.workspace = true
# Forms serialize TOML, but the write boundary parses it again before either
# routing or commit so comments/escapes cannot bypass the env-source rule.
toml.workspace = true
# Width is presentation data here: right-aligned tails must compare terminal
# cells, not UTF-8 bytes. Already present through ratatui, so this adds one
# direct edge and no crate to the lockfile.
unicode-width.workspace = true

[dev-dependencies]
# The board-live example decodes real kernel pages through the contract's
# `ProjectionRecord` before rendering them — the smoke run's whole point.
serde_json.workspace = true

[lints]
workspace = true
