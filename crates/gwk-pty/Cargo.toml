[package]
name = "gwk-pty"
version = "0.0.2"
description = "PTY engine: authoritative terminal grid, render-state deltas, and dual-attach reattach"
homepage = "https://gridwork.sh"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published. Building this crate needs Zig 0.15.2 and a ghostty checkout at
# a pinned revision (see pins.env), neither of which a crates.io consumer has —
# publishing it would ship a crate that fails to build for almost everyone.
#
# This keeps it out of the `package` job's derived assertion loops for free —
# they filter on `publish != []`. It does NOT keep it out of `cargo package
# --workspace`, which packages unpublishable members anyway and only declines to
# upload them; that job excludes this crate by name for exactly that reason.
publish = false

[dependencies]
libghostty-vt.workspace = true
pty-process.workspace = true
# One constant: `EIO`, to tell "the child hung up" apart from a real read
# failure. Spelling it `5` inline would need the same comment and would not
# survive someone reading it on a platform where it is not 5.
#
# `termios` reads the PTY's window size back out of the kernel. `resize` needs
# it to know what to roll a refused resize back to — the child can move that
# size itself, so a copy we kept would be stale without warning — and the tests
# need it because a field we set ourselves would agree with us no matter which
# order `resize` ran its two halves in, which is the thing they exist to catch.
rustix = { workspace = true, features = ["std", "termios"] }
sha2.workspace = true
thiserror.workspace = true
# `process` is for reaping the child, `io-util` for the reader's `read`. `rt`,
# `macros` and `time` are only wanted by the tests, but a dev-dependency on the
# same crate with different features unifies into one feature set anyway, so
# splitting them here would buy a longer manifest and nothing else.
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
] }

[lints]
workspace = true
