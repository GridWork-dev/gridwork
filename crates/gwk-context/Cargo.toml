[package]
name = "gwk-context"
version = "0.0.1"
description = "GridWork Context Runtime: truth stages, participation, and precedence — the vocabulary the compiler and verifier both speak"
homepage = "https://gridwork.sh"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published yet, and deliberately so: E2 publishes the immutable truth-record
# data shapes and schema, but no runtime consumes them and the V2 protocol grammar
# is not established until E3. Publishing now would mint a version number for an
# unusable partial surface. Reassess after E3 lands the complete public grammar.
publish = false

[dependencies]
# For `is_sha256_hex` and nothing else so far. `Digest` deliberately does NOT
# reuse `BlobAddress` (kickoff ruling R2 / fork F2) — same validation, different
# meaning — but re-implementing the hex check would be two places for one rule.
gwk-domain.workspace = true
serde.workspace = true
# Not a dev-dependency any more: `metadata.gridwork` is decoded with
# `serde_json::from_str` at parse time, because upstream metadata is
# `dict[str, str]` and a bounded JSON string is the only place structured
# extension data can live inside one (R35).
serde_json.workspace = true
specta = { workspace = true, features = ["serde_json"] }
# Skill manifests are YAML frontmatter. The accepted subset is enforced by
# `skill::scan_subset` BEFORE this crate sees a document, so duplicate keys,
# anchors, aliases, tags, and merge keys are properties of our own file rather
# than of whichever YAML crate is pinned — the historical divergence between
# serde-shaped YAML libraries is exactly on those points.
yaml_serde.workspace = true

[dev-dependencies]
# Serde round-trips only. The types above must survive the wire they are not on
# yet, and `deny_unknown_fields` is worth nothing unproven.
serde_json.workspace = true

# E2's four immutable truth records are public contract roots. Exporting their
# data shapes does not activate the V2 protocol; E3 owns that grammar.

[lints]
workspace = true
