services:
  postgres:
    image: postgres:18
    container_name: gwk-test-pg
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
