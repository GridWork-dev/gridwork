[package]
name = "gwk-pty-host"
version = "0.0.1"
description = "Resident PTY engine host: session registry, spawn, and detach/reattach routing"
homepage = "https://gridwork.dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published — matches gwk-pty and the gwk-adapter-* crates. Skeleton only
# (the runtime lands in a follow-up change): this crate is under CLEANROOM.md's
# second-review gate from its first line, both by the `crates/gwk-pty` prefix
# match and by its own explicit row in .github/cleanroom-paths.txt — gated for
# what it is FOR, not for what it contains yet.
publish = false

[[bin]]
name = "gwk-pty-host"
path = "src/main.rs"

[dependencies]
gwk-domain.workspace = true
gwk-kernel.workspace = true
serde_json.workspace = true
# The idempotency key an `IngestRecord` origination mints is a digest over
# the record's own body — the same content-addressing `gridwork`'s CLI
# already uses for `gw ingest submit` (`crates/gridwork/src/main.rs`'s
# `digest_of_json`). Already a workspace dependency; this crate reuses the
# convention rather than inventing a second one.
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
] }
tracing.workspace = true

[lints]
workspace = true
