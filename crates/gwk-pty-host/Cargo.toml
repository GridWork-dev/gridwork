[package]
name = "gwk-pty-host"
version = "0.0.1"
description = "Resident PTY engine host: session registry, spawn, and detach/reattach routing"
homepage = "https://gridwork.dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published — matches gwk-pty and the gwk-adapter-* crates. This crate is
# under CLEANROOM.md's second-review gate, both by the `crates/gwk-pty` prefix
# match and by its own explicit row in .github/cleanroom-paths.txt.
publish = false

[[bin]]
name = "gwk-pty-host"
path = "src/main.rs"

[dependencies]
base64.workspace = true
# The engine and the three adapters. Depending on them ends this crate's
# no-Zig build property deliberately: PR #43 kept the crate engine-free only
# because that change's execution environment carried no Zig toolchain, and
# the crate-root doc named supervision as the follow-up. Building or testing
# this crate now needs the same `tools/pty-toolchain.sh` environment as
# `gwk-pty` itself, and the `pty-host` CI job materializes it.
gwk-adapter-claude.workspace = true
gwk-adapter-codex.workspace = true
gwk-adapter-opencode.workspace = true
gwk-domain.workspace = true
gwk-kernel.workspace = true
gwk-pty.workspace = true
# For the `Command` a spawn factory builds — `gwk_pty::Session::spawn` takes
# it and does not re-export the crate.
pty-process.workspace = true
serde_json.workspace = true
# The idempotency key an `IngestRecord` origination mints is a digest over
# the record's own body — the same content-addressing `gridwork`'s CLI
# already uses for `gw ingest submit` (`crates/gridwork/src/main.rs`'s
# `digest_of_json`). Already a workspace dependency; this crate reuses the
# convention rather than inventing a second one.
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
