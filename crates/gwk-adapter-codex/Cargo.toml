[package]
name = "gwk-adapter-codex"
version = "0.0.2"
description = "codex engine adapter: app-server JSON-RPC, vendored schemas, native TUI through gwk-pty"
homepage = "https://gridwork.dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published, same reason as gwk-pty: the dependency on it makes this crate
# need Zig and a pinned ghostty checkout to build, and it is meaningless
# without a logged-in engine CLI besides. The `package` job excludes it by
# name, like gwk-pty.
publish = false

[dependencies]
gwk-domain.workspace = true
gwk-pty.workspace = true
pty-process.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `process` spawns the `codex app-server` child and its `/bin/cat`
# stand-in in tests; `io-util` is the buffered line reader/writer over its
# piped stdio. `rt`/`macros` are for the async tests themselves — a
# dev-only need, but a second feature set on the same crate would just
# unify back into one anyway (see gwk-pty's own manifest for the same call).
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt"] }

[lints]
workspace = true
