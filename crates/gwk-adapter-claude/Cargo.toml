[package]
name = "gwk-adapter-claude"
version = "0.0.2"
description = "claude-code engine adapter: bidirectional stream-json, PreToolUse approval, native TUI through gwk-pty"
homepage = "https://gridwork.sh"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published, same reason as gwk-pty: the dependency on it makes this crate
# need Zig and a pinned ghostty checkout to build, and it is meaningless
# without a logged-in engine CLI besides. The `package` job excludes it by
# name, like gwk-pty.
publish = false

[dependencies]
gwk-domain.workspace = true
gwk-pty.workspace = true
pty-process.workspace = true
# `process` spawns the bidirectional stream-json child; `net` is the
# PreToolUse relay's Unix-domain listener; `io-util` is `AsyncBufReadExt` /
# `AsyncWriteExt` on both; `macros` + `rt` are `#[tokio::test]` plus the
# single-threaded runtime it needs — no `rt-multi-thread`, the blocking hook
# client runs on a plain `std::thread`, never inside this crate's runtime.
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt"] }
# One call: `geteuid`, for the relay's peer-uid check — the workspace pin
# already carries the `process` feature this needs.
rustix.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
